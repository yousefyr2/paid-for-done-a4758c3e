    &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt; On 17 October it was 243 commits behind master and no longer merges cleanly. On 12 October Harness v2 (#2279) took migration number 986 for &lt;code&gt;986-harness-columns-and-statuses.sql&lt;/code&gt;, so the branch now conflicts with master in &lt;code&gt;migrations/RESERVATIONS.md&lt;/code&gt; and &lt;code&gt;migrations/rollback/986-rollback.sql&lt;/code&gt;. Master now goes up to 1019. Before pushing, the branch needs a new number, a rebase and a fresh run of its checks. The branch&amp;#39;s three changes are:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;The high-volume tier uses this month&#x27;s gross earnings (UTC calendar month). A failed lookup skips the tier with a warning.&lt;/li&gt;
      &lt;li&gt;The year-one tier treats a stored 0 as 12 months. It is in its own commit so it can be dropped.&lt;/li&gt;
      &lt;li&gt;Migration 986 adds &lt;code&gt;execution.executions.gate_outcome&lt;/code&gt; (approve, revision, reject, escalate or failed) and &lt;code&gt;gate_decided_at&lt;/code&gt;. They are written after the result handler settles the task, the first outcome is kept, and a failed write never blocks a result. A read-only shadow report shows, per developer, what they were credited against what accepted-only would pay. It refuses database roles that can&#x27;t see send-backs.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;298 payout tests, 174 result-handler tests, lint, the full type check and a real-database migration check pass. Two code reviews scored it 86 and 79, and every major finding was fixed. Details are on the review page.&lt;/p&gt;
  &lt;/div&gt;
  &lt;ol class=&quot;phases col&quot;&gt;
    &lt;li&gt;
      &lt;div class=&quot;ph&quot;&gt;Step 1 · on the branch&lt;/div&gt;
      &lt;h3&gt;Fix fees and keep every verdict&lt;/h3&gt;
      &lt;p&gt;Done on the branch. Still to do: measure how often the Judge agrees with people.&lt;/p&gt;
      &lt;p class=&quot;exit&quot;&gt;&lt;b&gt;Done when:&lt;/b&gt; every attempt carries its verdict and Judge-versus-person agreement is measured per kind of task.&lt;/p&gt;
    &lt;/li&gt;
    &lt;li&gt;
      &lt;div class=&quot;ph&quot;&gt;Step 2 · started on the branch&lt;/div&gt;
      &lt;h3&gt;Hold earnings until acceptance, in shadow first&lt;/h3&gt;
      &lt;p&gt;Run the shadow report for a few weeks, then switch on held earnings with the auto-accept window.&lt;/p&gt;
      &lt;p class=&quot;exit&quot;&gt;&lt;b&gt;Done when:&lt;/b&gt; a rejected attempt earns nothing and an accepted one releases after the window.&lt;/p&gt;
    &lt;/li&gt;
    &lt;li&gt;
      &lt;div class=&quot;ph&quot;&gt;Step 3 · 1 to 2 weeks&lt;/div&gt;
      &lt;h3&gt;Lock in neutral routing, teach taste both ways, reopen the market&lt;/h3&gt;
      &lt;p&gt;Write the no-steering rule into code and tests. Make the taste signal learn from send-backs and reasons per kind of task and give it weight. Reconnect or replace the newcomer boost and correct the whitepaper.&lt;/p&gt;
      &lt;p class=&quot;exit&quot;&gt;&lt;b&gt;Done when:&lt;/b&gt; a test fails if ranking reads a money field, a send-back measurably lowers that agent for that person, and newcomers get chosen at a known rate.&lt;/p&gt;
    &lt;/li&gt;
    &lt;li&gt;
      &lt;div class=&quot;ph&quot;&gt;Step 4 · 1 to 2 weeks&lt;/div&gt;
      &lt;h3&gt;Revisions off the person&#x27;s bill&lt;/h3&gt;
      &lt;p&gt;Revision attempts are charged to the agent.&lt;/p&gt;
      &lt;p class=&quot;exit&quot;&gt;&lt;b&gt;Done when:&lt;/b&gt; a task the Judge rejects three times costs the person nothing.&lt;/p&gt;
    &lt;/li&gt;
    &lt;li&gt;
      &lt;div class=&quot;ph&quot;&gt;Step 5 · 3 to 5 weeks&lt;/div&gt;
      &lt;h3&gt;Fixed-price tasks, ranked on the cost of a finished task&lt;/h3&gt;
      &lt;p&gt;Agents publish prices; people get one quote; ranking uses taste fit × acceptance ÷ finished cost; agents see scorecards; disputes get a queue. Start with two or three checkable kinds of task.&lt;/p&gt;
      &lt;p class=&quot;exit&quot;&gt;&lt;b&gt;Done when:&lt;/b&gt; a person can request a supported task, see one price, and pay only on delivery.&lt;/p&gt;
    &lt;/li&gt;
    &lt;li&gt;
      &lt;div class=&quot;ph&quot;&gt;Step 6 · later&lt;/div&gt;
      &lt;h3&gt;Share of the return, only where value is countable&lt;/h3&gt;
      &lt;p&gt;For recoveries, refunds and bookings, price as a share of measured value with a floor.&lt;/p&gt;
      &lt;p class=&quot;exit&quot;&gt;&lt;b&gt;Done when:&lt;/b&gt; one kind of task earns from value created, with an audit trail the person can check.&lt;/p&gt;
    &lt;/li&gt;
  &lt;/ol&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;h3&gt;Decisions for you&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Push the branch and open the pull request? My recommendation: yes. Its migration number has now been taken twice while it sat unpushed (940 by 10 October, 986 on 12 October). Push right after renumbering.&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Keep the year-one fix (10%, as the whitepaper promises)? Recommendation: keep it.&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Refund first-year developers already charged 20%? Recommendation: check the amount first; staging payouts move no real money.&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;What is Span&#x27;s published fee per kind of task, and does the legal page change to say so?&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Which ranking setting runs on staging, and should taste get weight now?&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;What counts as accepted: is the Judge enough, or must the person&#x27;s window pass? Is 72 hours right? And does an unchecked answer the person chose to use (new on 13 October) pay in full?&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Accounting treatment of revenue as merchant of record.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 10 --&gt;
&lt;section id=&quot;s10&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;10 · Risks&lt;/div&gt;
    &lt;h2&gt;Where this can go wrong&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Span becomes the new sponsored search.&lt;/b&gt; This is the biggest risk. Revenue pressure will push toward &quot;featured&quot; agents or fee-dependent ranking. Rule 1 and its test are the defense, and the whitepaper already invites anyone to check.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Gaming the Judge.&lt;/b&gt; If money depends on the Judge, agents will optimize to pass it rather than to do the task. Sample people&#x27;s verdicts against the Judge&#x27;s, rotate checks, and let a person&#x27;s send-back override the Judge.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Taste becomes a bubble.&lt;/b&gt; Learning someone&#x27;s habits can trap them in yesterday&#x27;s choices. A working newcomer boost and occasional fresh options keep the door open.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Taste data is sensitive.&lt;/b&gt; What someone keeps and rejects says a lot about them. It must follow the privacy rules in 6.2.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;People withholding acceptance.&lt;/b&gt; The auto-accept window, per-person rejection rates and rate limits on serial rejecters handle most of it.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Agents pricing up or refusing hard tasks.&lt;/b&gt; Moving risk onto agents makes them charge for it. That&#x27;s correct, but some kinds of task will get pricier or lose supply. Keep metered mode for them.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Span carries refund and check costs.&lt;/b&gt; When a quoted task fails, Span eats the checks and loses the sale. Price a small risk margin into the fee per kind of task, and cap exposure with the retry limit.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Superstars anyway.&lt;/b&gt; If one agent really is best for nearly everyone, work concentrates. That&#x27;s fine when it&#x27;s earned; the concentration measure shows whether it is.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Promises ahead of code.&lt;/b&gt; The whitepaper cites a newcomer boost that&#x27;s switched off and fee tiers that don&#x27;t work, and the legal page says there&#x27;s no fee. Public writing, including the blog post, should describe only what&#x27;s true or clearly mark what&#x27;s planned.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Reported revenue looks smaller.&lt;/b&gt; Net-first reporting is honest but less flattering than gross. That is the point of the tweet.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;Bottom line.&lt;/b&gt; In an economy where agents decide what to buy and whom to hire, the systems that find, judge and route the work become as important as the work itself. Span is one of those systems. It wins only if it is visibly on the person&#x27;s side: it ranks on taste, verified quality and the real cost of finished work, never on who pays, and it pays agents only for work people keep. Much of the plumbing exists. The missing pieces are saving verdicts (on the branch), held earnings, taste that learns from send-backs and actually counts, a working newcomer boost, a tested no-steering rule, a published fee, per-task prices and a dispute path. I&#x27;m about 75% confident in steps 1 to 4 as written; step 5&#x27;s details should be tested against real acceptance data first.&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 11 --&gt;
&lt;section id=&quot;s11&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;11 · Blog post draft&lt;/div&gt;
    &lt;h2&gt;Paid for Done&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Draft&lt;/span&gt; Written in your voice for the Span blog, from sections 1 to 3, 5 and 10. It follows the format of your other posts (title, excerpt, suggested questions) and passes the publishing rules: no em dashes, no &quot;not X but Y&quot; contrasts, no slogan endings. About 1,180 words. A copy ready for &lt;code&gt;src/frontend/content/blog/posts/&lt;/code&gt; is saved at &lt;code&gt;~/.claude/plans/paid-for-done/paid-for-done-blog.md&lt;/code&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Field&lt;/th&gt;&lt;th&gt;Draft&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Title&lt;/td&gt;&lt;td&gt;Paid for Done&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Excerpt&lt;/td&gt;&lt;td&gt;AI is sold by the token today. It will be sold by the finished task. Span is moving to pay agents only for work people keep, with one published fee and a ranking that never favors whoever pays most.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Suggested questions&lt;/td&gt;&lt;td&gt;What does Span count as accepted work?&lt;br&gt;Why can&amp;#x27;t agents pay for a better spot in Span?&lt;br&gt;When does Span take a share of the value a task creates?&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;&lt;b&gt;Check before publishing.&lt;/b&gt; The second paragraph under &quot;Where Span stands&quot; says how Span pays today, including that a rejected attempt earns the same as an approved one. That is accurate and makes the change concrete, but it discloses current internals; cut that part if you would rather not. The 72-hour window, the published fee and the newcomer share are proposals, written as plans (&quot;will&quot;), not as shipped features. Add the link to Chamath&amp;#39;s post on X before it goes live.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;article class=&quot;col&quot; aria-label=&quot;Blog post draft&quot;&gt;
    &lt;p&gt;Chamath Palihapitiya summed up where the AI business stands in four lines. &quot;Most everyone is selling CPM. Cost per thousand tokens + markup.&quot; Next, he wrote, &quot;Everyone will sell CPA. Accomplish the task, participate in the ROI.&quot; On the way there he expects &quot;a lot of value destruction,&quot; and he points to the Web1 and mobile transitions as examples.&lt;/p&gt;
    &lt;h3&gt;From impressions to results&lt;/h3&gt;
    &lt;p&gt;He is talking about how AI is sold, and he borrows the terms from advertising. CPM is cost per mille, the price of a thousand impressions. An advertiser paid every time a banner was shown, whether anyone clicked or bought. CPA is cost per acquisition: the advertiser pays when someone signs up or buys. Advertising moved from the first to the second because buyers wanted to pay for outcomes, and the companies that could measure outcomes took the market. Google&#x27;s search ads moved to charging per click in 2002, and every year after, the measurement got closer to the sale.&lt;/p&gt;
    &lt;p&gt;AI is still in its banner-ad era. Model labs sell tokens, and most AI products resell those tokens with a markup, packaged as seats or credits. The buyer pays for effort. If an agent spends four dollars of compute and gets the work wrong, the buyer still pays four dollars, and pays again for the retry. Revenue grows with usage whether or not anything got done.&lt;/p&gt;
    &lt;p&gt;That pricing flatters the numbers investors look at. Revenue includes the token bill that passes straight through to the model provider. Gross margins look healthy because failed and repeated work is billed like good work. Run-rates multiply the best month by twelve, pilots and experiments included. Once buyers pay only for finished work, those numbers get restated, and some companies built on them will not survive it, which is the value destruction he expects.&lt;/p&gt;
    &lt;h3&gt;Where Span stands&lt;/h3&gt;
    &lt;p&gt;Span is the conversation people use to get work done across agents from many providers. A person describes the job, and Span does it itself or routes it to the specialist agent best suited to it. Span holds the provider accounts, pays the agents and bills the person. Every dollar spent on agent work passes through us, which makes Span exactly the kind of company that could count pass-through as revenue and call it growth. We want to build the version that holds up after the transition.&lt;/p&gt;
    &lt;p&gt;Today Span pays the way most of the market does. An agent&#x27;s attempt is charged at the cost the agent reports, and the developer is credited that amount minus our fee as soon as it lands. Our quality check, the Judge, reviews every attempt and decides whether to approve it, send it back for revision, reject it or hand it to the person. That verdict decides what the person sees. It does not yet decide who gets paid. A rejected attempt earns the same as an approved one, and each revision is billed as a new attempt.&lt;/p&gt;
    &lt;h3&gt;Paid for accepted work&lt;/h3&gt;
    &lt;p&gt;We are changing that. Span will pay agents for accepted work. Accepted means the Judge approves the work and the person keeps it. After delivery the person has a window, 72 hours to start, to send it back, and silence counts as keeping it. The agent&#x27;s earnings are held during the window and released when it closes. Failed attempts and rework are the agent&#x27;s cost. The person pays one price, quoted before the work starts, and only for work they keep.&lt;/p&gt;
    &lt;p&gt;This changes what a good agent is. Under token pricing, an agent that takes more steps earns more. Under acceptance pricing, the agent that gets the work right the first time, at a low cost, earns the most. Developers are paid for being right, which is the incentive they should have had from the start.&lt;/p&gt;
    &lt;h3&gt;A router nobody can buy&lt;/h3&gt;
    &lt;p&gt;It also changes what the router has to be. When agents choose the work, the router decides who gets hired. Advertising&#x27;s results era carries a warning here: it came with paid placement, and the top result in a search box was often the one that paid most. If agents could pay Span for position, or if Span ranked its own margin above the person&#x27;s interest, the person would be paying for a worse result in a less visible way.&lt;/p&gt;
    &lt;p&gt;Two rules sit underneath the change. Span charges one published fee per kind of task, the same for every agent, so it gains nothing by steering work toward one agent over another. And Span&#x27;s fee and margin are never inputs to the ranking. Agents are ranked on how well they fit the person&#x27;s taste, how often their work is accepted, and the real cost of a finished task, which includes the attempts that failed. An agent that is cheap per attempt but often sent back is expensive per finished task, and the ranking should see that.&lt;/p&gt;
    &lt;p&gt;The ranking also has to learn taste. A person&#x27;s agent will build habits from every verdict, learning which answers they keep and which they send back. That raises an open question about the agent economy. Demand could concentrate on a few superstar agents, because rational buyers converge on the same best product. Or it could spread out, because agents are good at drawing out each person&#x27;s particular preferences. We think a neutral router that learns each person&#x27;s taste pushes toward the second outcome, and we will give newer agents a measured share of work so the market stays open to them.&lt;/p&gt;
    &lt;h3&gt;The share of the value comes later&lt;/h3&gt;
    &lt;p&gt;&quot;Participate in the ROI&quot; is the step after that, and we are holding it back on purpose. Some tasks have a result you can count, such as a refund recovered or a meeting booked. For those, a share of the value is fair. Most tasks have no clean number. &quot;Help me think through my pricing&quot; has no finish line you can price as a percentage, and advertising showed what happens when payment rides on outcomes that are easy to claim: fake sign-ups, and credit taken for sales that would have happened anyway. We will start with fixed prices for work that can be checked, and add a share of the value only where the value can be counted.&lt;/p&gt;
    &lt;h3&gt;How we get there&lt;/h3&gt;
    &lt;p&gt;We are doing this in steps, and each one is useful by itself. First, Span keeps the Judge&#x27;s verdict on every attempt. Next, a shadow report shows each developer what they were paid against what acceptance-based pay would have paid, before any money moves. After that, earnings are held until acceptance, prices are quoted per task, and every agent gets a scorecard of its acceptance rate and one way to contest a send-back. When we report revenue, we will lead with what Span keeps after agents and model providers are paid.&lt;/p&gt;
    &lt;p&gt;Chamath closed with &quot;Good luck to all the players!&quot; The companies that come through this transition will be the ones already measuring results when buyers start asking for them. For a marketplace, that means paying for work people keep and making sure nobody can buy their way to the top.&lt;/p&gt;
  &lt;/article&gt;
&lt;/section&gt;

&lt;!-- Appendix A --&gt;
&lt;section id=&quot;apxA&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;Appendix A&lt;/div&gt;
    &lt;h2&gt;Source notes, verbatim&lt;/h2&gt;
    &lt;p&gt;Kept word for word so the blog post can quote or paraphrase them accurately. Image links in the second note are left out.&lt;/p&gt;
    &lt;h3&gt;A.1 The tweet (Chamath Palihapitiya)&lt;/h3&gt;
    &lt;div class=&quot;source&quot;&gt;
      &lt;p&gt;Current State of the Union of AI/SI: Most everyone is selling CPM. Cost per thousand tokens + markup.&lt;/p&gt;
      &lt;p&gt;Future State of the Union of AI/SI: Everyone will sell CPA. Accomplish the task, participate in the ROI.&lt;/p&gt;
      &lt;p&gt;In the transition from CPM to CPA, we will debunk much of the current gamesmanship around revenues, gross margins and run-rates. This will necessarily involve a lot of value destruction. See Web1 and Mobile transitions for examples.&lt;/p&gt;
      &lt;p&gt;Good luck to all the players!&lt;/p&gt;
      &lt;p&gt;&lt;i&gt;Chamath Palihapitiya, on X.&lt;/i&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;h3&gt;A.2 Your notes&lt;/h3&gt;
    &lt;div class=&quot;source&quot;&gt;
      &lt;p&gt;Adjust our internal taste through RL personalize selection taste - My belief for the personal agent when transacting with other agents for transactions, it will accumulate a similiar, taste, and build habits that reflect the preferences of the user.&lt;/p&gt;
      &lt;p&gt;A big question is whether agents will increase superstar effects (rational agents all settle on the same product) or increase dispersion (because everyone has slightly different tastes and preferences, which agents are good at eliciting, finally overcoming the artificial clustering we&#x27;ve been subjected to).&lt;/p&gt;
      &lt;p&gt;Many internet companies have monetized demand routing, which is in turn often predicated on short attention spans. &quot;I&#x27;ll click on the first thing I see.&quot; This has led to some amount of inefficiency, as companies try to propitiate capricious ranking algorithms and incur various placement fees. It&#x27;s not all deadweight loss (willingness to pay is itself a kind of signal, which is valuable to buyers), but it&#x27;s not great. How will the nature and value of this routing change in a world of personal agents? More personalized routing, reflecting taste, in addition to ranked placement.&lt;/p&gt;
      &lt;p&gt;For general purchases: Much of what I&#x27;m writing hinges on the assumption that personal agents will be on the consumer&#x27;s side. + for services we should find a way to neutralize routing, taking the preferences of the user and making a selection on the basis of it&lt;/p&gt;
      &lt;p&gt;ssorted things I&#x27;ve been mulling over regarding agents in the economy:&lt;/p&gt;
      &lt;p&gt;• Companies are in some sense the original superintelligence. It&#x27;s often the case that they can use their amortized cognitive surplus to advance their interests against those of certain consumers: relative to the optimization capacity of companies, consumers can be inattentive, underinformed, irrational, etc. (Think, say, of some of the classic insurance upsells at the end of a booking process, which is typically priced substantially above what a regular policy would cost.) Herbert Simon introduced the idea of bounded rationality, and firms often end up benefiting from it. Thanks to personal agents, we will probably get somewhat more rational in how we engage with companies.&lt;/p&gt;
      &lt;p&gt;• How exactly will outcomes change? Well, certain kinds of price discrimination will work less well (how do coupons work if every agent hunts fastidiously for them?), and certain kinds of customer cross-subsidy will change (today, people who forget to cancel subscriptions subsidize those who don&#x27;t). Taken across the economy as a whole, I&#x27;m not sure what the incidence of all of this will be.&lt;/p&gt;
      &lt;p&gt;• In corporate strategy, people have long debated the relative importance of distribution and product quality. Perhaps you&#x27;ve made something better, but does anyone know about it? Won&#x27;t people just continue to buy the ACME Corp Mousetraps? Personal agents will, I think, act as a kind of structural subsidy for product quality. How would markets look different if individuals always spent at least 10 hours researching their purchases? On the margin, focusing on making a product better is, I think, going to become a more effective strategy for companies. This is good!&lt;/p&gt;
    &lt;/div&gt;
    &lt;h3&gt;A.3 The plain-English breakdown you shared&lt;/h3&gt;
    &lt;div class=&quot;source&quot;&gt;
      &lt;p&gt;The author is making a very important argument about how AI agents could change the economy.&lt;/p&gt;
      &lt;p&gt;The central idea is simple: Today, companies have an advantage over consumers because they have more information, more resources, and more time to figure out how to sell to us. AI agents could eliminate much of that advantage by giving every consumer an intelligent assistant that works in their best interest.&lt;/p&gt;
      &lt;p&gt;And if that happens, companies may have to compete more on how good their products actually are, rather than how good they are at marketing and selling them.&lt;/p&gt;
      &lt;p&gt;Here&#x27;s the argument, broken down into plain English.&lt;/p&gt;
      &lt;h4&gt;1. Companies are smarter than individual consumers&lt;/h4&gt;
      &lt;p&gt;Think about booking a flight.&lt;/p&gt;
      &lt;p&gt;An airline has entire teams dedicated to figuring out how to make you spend more money. They study your behavior, experiment with prices, and figure out when you&#x27;re most likely to buy unnecessary extras.&lt;/p&gt;
      &lt;p&gt;Meanwhile, you&#x27;re just one person trying to book a flight.&lt;/p&gt;
      &lt;p&gt;You don&#x27;t have the time to compare every airline, read every insurance policy, or understand every hidden fee.&lt;/p&gt;
      &lt;p&gt;The company has hundreds of people optimizing how to make money from you. You have only yourself.&lt;/p&gt;
      &lt;p&gt;Now imagine you have an AI agent that does all the research for you, understands the tricks companies use, and makes sure you get the best deal.&lt;/p&gt;
      &lt;p&gt;Suddenly, the consumer becomes much harder to exploit.&lt;/p&gt;
      &lt;p&gt;That&#x27;s the first argument.&lt;/p&gt;
      &lt;h4&gt;2. Some business models depend on consumers being lazy or forgetful&lt;/h4&gt;
      &lt;p&gt;Consider subscriptions.&lt;/p&gt;
      &lt;p&gt;Netflix, gyms, and software companies sometimes make money from people who forget to cancel subscriptions they no longer use.&lt;/p&gt;
      &lt;p&gt;Or consider coupons.&lt;/p&gt;
      &lt;p&gt;Two people buy the same product. One spends 20 minutes finding a discount code and pays $80. The other doesn&#x27;t bother and pays $100.&lt;/p&gt;
      &lt;p&gt;Companies benefit from these differences in consumer behavior.&lt;/p&gt;
      &lt;p&gt;But what happens when everyone has an AI agent that automatically finds coupons, cancels unused subscriptions, and negotiates better deals?&lt;/p&gt;
      &lt;p&gt;Those opportunities for companies to make extra money start disappearing.&lt;/p&gt;
      &lt;p&gt;The author is saying this could change how businesses price their products and make money.&lt;/p&gt;
      &lt;h4&gt;3. Better products could finally beat better marketing&lt;/h4&gt;
      &lt;p&gt;This is arguably the most important point.&lt;/p&gt;
      &lt;p&gt;Imagine two companies selling headphones.&lt;/p&gt;
      &lt;p&gt;Company A&lt;/p&gt;
      &lt;p&gt;Makes average headphones, but spends millions on advertising, influencers, and getting its products to appear first on Amazon.&lt;/p&gt;
      &lt;p&gt;Company B&lt;/p&gt;
      &lt;p&gt;Makes excellent headphones with better sound, longer battery life, and a lower price, but barely spends anything on advertising.&lt;/p&gt;
      &lt;p&gt;Today, Company A might win because more people know about it.&lt;/p&gt;
      &lt;p&gt;But imagine everyone has an AI agent that researches every purchase, compares independent reviews, evaluates specifications, and identifies the best headphones for their needs.&lt;/p&gt;
      &lt;p&gt;The agent might recommend Company B even if the consumer has never heard of it.&lt;/p&gt;
      &lt;p&gt;AI agents could make it easier for the best product to win, rather than the best-advertised product.&lt;/p&gt;
      &lt;p&gt;This would fundamentally change how companies compete.&lt;/p&gt;
      &lt;p&gt;Instead of spending another $10 million on advertising, a company might find it more profitable to spend that money improving its product.&lt;/p&gt;
      &lt;h4&gt;4. Information about product quality becomes extremely valuable&lt;/h4&gt;
      &lt;p&gt;Today, most people don&#x27;t read 500 customer reviews before buying something.&lt;/p&gt;
      &lt;p&gt;But an AI agent can.&lt;/p&gt;
      &lt;p&gt;It can compare thousands of reviews, examine return rates, analyze product performance, and identify recurring complaints.&lt;/p&gt;
      &lt;p&gt;That means information about how good a product actually is becomes much more valuable.&lt;/p&gt;
      &lt;p&gt;For example, a small company might have a product with a 2% failure rate while a famous competitor has a 15% failure rate.&lt;/p&gt;
      &lt;p&gt;Most consumers would never discover that difference.&lt;/p&gt;
      &lt;p&gt;But an AI agent could.&lt;/p&gt;
      &lt;p&gt;The more intelligent our agents become, the more valuable reliable information about products becomes.&lt;/p&gt;
      &lt;p&gt;This also creates opportunities for companies that collect, verify, and organize product-quality data.&lt;/p&gt;
      &lt;h4&gt;5. Will AI make everyone buy the same thing or discover different things?&lt;/h4&gt;
      &lt;p&gt;The author raises an interesting question.&lt;/p&gt;
      &lt;p&gt;Imagine every consumer has an incredibly intelligent shopping agent.&lt;/p&gt;
      &lt;p&gt;Two possible outcomes emerge.&lt;/p&gt;
      &lt;p&gt;Scenario A: Everyone buys the same products.&lt;/p&gt;
      &lt;p&gt;If one laptop is objectively better than every competitor, millions of agents might recommend it.&lt;/p&gt;
      &lt;p&gt;The winning company becomes even more dominant.&lt;/p&gt;
      &lt;p&gt;Scenario B: People buy more different products.&lt;/p&gt;
      &lt;p&gt;Your agent knows you care about battery life. My agent knows I care about screen quality. Someone else&#x27;s agent knows they need the lightest possible laptop.&lt;/p&gt;
      &lt;p&gt;Instead of everyone buying the most popular laptop, agents find the product that best fits each individual.&lt;/p&gt;
      &lt;p&gt;This could help smaller, specialized companies succeed.&lt;/p&gt;
      &lt;p&gt;The author doesn&#x27;t know which effect will be stronger.&lt;/p&gt;
      &lt;h4&gt;6. AI agents could threaten Google&#x27;s and Amazon&#x27;s advertising businesses&lt;/h4&gt;
      &lt;p&gt;This is another major point.&lt;/p&gt;
      &lt;p&gt;Today, companies pay enormous amounts of money to appear where consumers are looking.&lt;/p&gt;
      &lt;p&gt;For example, when you search for a product on Google or Amazon, companies pay to appear near the top.&lt;/p&gt;
      &lt;p&gt;Why?&lt;/p&gt;
      &lt;p&gt;Because consumers often click the first few results.&lt;/p&gt;
      &lt;p&gt;TODAY&lt;/p&gt;
      &lt;p&gt;Consumer searches for headphones&lt;/p&gt;
      &lt;p&gt;Google / Amazon ranks results&lt;/p&gt;
      &lt;p&gt;Consumer clicks a prominent result&lt;/p&gt;
      &lt;p&gt;WITH PERSONAL AI AGENTS&lt;/p&gt;
      &lt;p&gt;Consumer asks agent for headphones&lt;/p&gt;
      &lt;p&gt;Agent researches and compares products&lt;/p&gt;
      &lt;p&gt;Agent recommends the best fit&lt;/p&gt;
      &lt;p&gt;If AI agents become the primary way consumers discover and purchase products, paying Google to appear first might become less valuable.&lt;/p&gt;
      &lt;p&gt;Companies would instead need to convince AI agents that their products are worth recommending.&lt;/p&gt;
      &lt;p&gt;The power to direct consumer spending could shift from search engines and advertising platforms to AI agents.&lt;/p&gt;
      &lt;p&gt;However, this creates another question: Will agent platforms themselves start charging companies for recommendations?&lt;/p&gt;
      &lt;p&gt;Which leads to the next point.&lt;/p&gt;
      &lt;h4&gt;7. Everything depends on whether AI agents actually work for consumers&lt;/h4&gt;
      &lt;p&gt;The author acknowledges a major assumption.&lt;/p&gt;
      &lt;p&gt;What if your AI agent doesn&#x27;t recommend the best product?&lt;/p&gt;
      &lt;p&gt;What if it recommends the company that pays the agent provider the highest commission?&lt;/p&gt;
      &lt;p&gt;Then we&#x27;ve recreated the same problem.&lt;/p&gt;
      &lt;p&gt;Instead of Google selling sponsored search results, AI agents could sell sponsored recommendations.&lt;/p&gt;
      &lt;p&gt;The consumer still wouldn&#x27;t know whether they&#x27;re receiving the best advice.&lt;/p&gt;
      &lt;p&gt;So the entire argument depends on whether personal AI agents genuinely represent the interests of their users.&lt;/p&gt;
      &lt;p&gt;An agent that works for you should optimize for what you want, not what generates the highest commission for its operator.&lt;/p&gt;
      &lt;h4&gt;8. The final paragraph: The economy could reward quality more accurately&lt;/h4&gt;
      &lt;p&gt;The author describes the market as a giant machine that decides how much value different products and companies deserve.&lt;/p&gt;
      &lt;p&gt;Today, that machine is imperfect.&lt;/p&gt;
      &lt;p&gt;Excellent products sometimes fail because nobody discovers them. Mediocre products sometimes succeed because they have excellent distribution.&lt;/p&gt;
      &lt;p&gt;AI agents could improve that process.&lt;/p&gt;
      &lt;p&gt;When consumers have access to better information and more intelligent decision-making, money could flow more consistently toward companies that create genuine value.&lt;/p&gt;
      &lt;p&gt;The author calls this a change in the economy&#x27;s backpropagation.&lt;/p&gt;
      &lt;p&gt;That&#x27;s a machine-learning analogy. In simple terms, companies receive clearer feedback about what consumers actually value, and better products receive greater financial rewards.&lt;/p&gt;
      &lt;h4&gt;What I think is most important for Span&lt;/h4&gt;
      &lt;p&gt;There is a particularly interesting implication here that extends beyond shopping.&lt;/p&gt;
      &lt;p&gt;The author is describing a world where AI agents become the decision-makers that direct economic demand.&lt;/p&gt;
      &lt;p&gt;Today, consumers discover software, services, and companies through search engines, advertising, app stores, and recommendations.&lt;/p&gt;
      &lt;p&gt;But imagine a world where someone simply tells their AI:&lt;/p&gt;
      &lt;p&gt;&quot;Build me a website for my business.&quot;&lt;/p&gt;
      &lt;p&gt;Instead of searching Google for website builders, comparing freelancers, and evaluating design agencies, their AI could discover and select the best specialized agent to complete the job.&lt;/p&gt;
      &lt;p&gt;The same applies to preparing tax returns, editing videos, analyzing contracts, conducting research, or completing other forms of digital work.&lt;/p&gt;
      &lt;p&gt;This creates a potentially important shift:&lt;/p&gt;
      &lt;p&gt;The competition moves from being discovered by humans to being selected by agents.&lt;/p&gt;
      &lt;p&gt;And that introduces three distinct opportunities:&lt;/p&gt;
      &lt;p&gt;1. Discovery: How does an AI find all the specialized agents capable of performing a task?&lt;br&gt;2. Selection: How does it determine which agent is best based on quality, price, reliability, and the user&#x27;s needs?&lt;br&gt;3. Execution: How does it hire that agent, pay it, verify its work, and deliver the result?&lt;/p&gt;
      &lt;p&gt;The author&#x27;s argument focuses primarily on how personal agents could improve consumer decision-making.&lt;/p&gt;
      &lt;p&gt;Span&#x27;s opportunity is related but broader: building the infrastructure that allows demand to find and transact with the best available AI services.&lt;/p&gt;
      &lt;p&gt;There is one critical distinction, though. Routing doesn&#x27;t automatically reward quality. It rewards whatever the routing system is designed to optimize. If the system prioritizes commissions, it can recreate the same problems as sponsored search. If it prioritizes verified outcomes and user interests, it can make quality a genuine competitive advantage.&lt;/p&gt;
      &lt;p&gt;The single biggest takeaway is this:&lt;/p&gt;
      &lt;p&gt;In an economy where agents increasingly decide what to buy and whom to hire, the systems that discover, evaluate, and route demand could become as important as the products and services themselves.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- Appendix B --&gt;
&lt;section id=&quot;apxB&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;Appendix B&lt;/div&gt;
    &lt;h2&gt;Glossary&lt;/h2&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Term&lt;/th&gt;&lt;th&gt;Meaning here&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;CPM&lt;/td&gt;&lt;td&gt;Cost per mille (thousand). Paying per unit of effort or exposure, whatever the result. In AI, per thousand tokens. At Span today: every attempt is charged at the agent&amp;#39;s reported cost and credited to the developer minus Span&amp;#39;s fee, whether the work was approved or rejected.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;CPA&lt;/td&gt;&lt;td&gt;Cost per acquisition. Paying only for a result. At Span (proposed): the result is an accepted task, meaning the Judge approved it and the person didn&amp;#39;t send it back within the window. The person pays a price quoted up front, the agent is paid on acceptance, and failed attempts and rework cost the agent.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;ROI&lt;/td&gt;&lt;td&gt;Return on investment: the value a purchase produces.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Run-rate&lt;/td&gt;&lt;td&gt;This period&#x27;s revenue scaled to a full year.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Bounded rationality&lt;/td&gt;&lt;td&gt;Herbert Simon&#x27;s idea that people decide with limited time, information and attention.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Price discrimination&lt;/td&gt;&lt;td&gt;Charging different people different prices for the same thing, for example through coupons.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cross-subsidy&lt;/td&gt;&lt;td&gt;One group of customers paying for another, for example forgotten subscriptions.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Incidence&lt;/td&gt;&lt;td&gt;Who ends up bearing a cost or getting a benefit once everything adjusts.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Superstar effect / dispersion&lt;/td&gt;&lt;td&gt;Demand piling onto one winner, versus spreading across many good fits.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Demand routing&lt;/td&gt;&lt;td&gt;Deciding which seller a buyer is sent to: search rankings, ads, recommendations, or an agent&#x27;s choice.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Backpropagation&lt;/td&gt;&lt;td&gt;In machine learning, sending error signals back so a system improves. Used here for markets getting clearer feedback.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Reinforcement learning&lt;/td&gt;&lt;td&gt;Learning from rewards. Here, each keep or send-back is a reward that tunes how Span picks agents for a person.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;SpanRank&lt;/td&gt;&lt;td&gt;Span&#x27;s score for choosing an agent: a weighted sum of relevance, trust, performance, cost, health, predicted quality, skill confidence, ratings and taste.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Taste signal&lt;/td&gt;&lt;td&gt;Span&#x27;s per-person, per-agent score from approvals, fading with a 30-day half-life.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Judge and Verifier&lt;/td&gt;&lt;td&gt;Span&#x27;s two automated quality checks on each attempt: one judges the work, the other checks facts, safety and policy.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Merchant of record&lt;/td&gt;&lt;td&gt;The party that sells to the customer and takes payment. Span, for agents and tools it buys on the person&#x27;s behalf.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Shadow mode&lt;/td&gt;&lt;td&gt;Calculating what a new rule would do without letting it change anything yet.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Migration&lt;/td&gt;&lt;td&gt;A numbered script that changes the database&#x27;s structure.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Idempotent&lt;/td&gt;&lt;td&gt;Safe to run twice: a repeated payout or result doesn&#x27;t count double.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;script&gt;
(function () {
  var ids = [&#x27;p&#x27;,&#x27;n&#x27;,&#x27;c&#x27;,&#x27;r&#x27;,&#x27;b&#x27;,&#x27;f&#x27;,&#x27;j&#x27;];
  var el = {};
  ids.forEach(function (k) { el[k] = document.getElementById(k); });
  var presets = {
    strong:  { p: 0.92, n: 3, c: 1.20, r: 1.80, b: 1.95, f: 0.20, j: 0.08 },
    typical: { p: 0.75, n: 3, c: 1.20, r: 1.80, b: 2.10, f: 0.20, j: 0.08 },
    weak:    { p: 0.40, n: 3, c: 1.20, r: 1.80, b: 2.10, f: 0.20, j: 0.08 }
  };
  function usd(x) { var s = x &lt; 0 ? &#x27;−$&#x27; : &#x27;$&#x27;; return s + Math.abs(x).toFixed(2); }
  function pct(x) { return (x * 100).toFixed(0) + &#x27;%&#x27;; }
  function model(v) {
    var q = 1 - v.p;
    var pd = 1 - Math.pow(q, v.n);
    var ea = (1 - Math.pow(q, v.n)) / v.p;
    var compute = v.c * ea;
    var t = {}, o = {};
    t.pd = pd; t.ea = ea;
    t.user = (v.r + v.j) * ea;
    t.perDone = t.user / pd;
    t.wasted = t.user - (v.r + v.j) * pd;
    t.agent = (1 - v.f) * v.r * ea - compute;
    t.span = v.f * v.r * ea;
    t.spanPct = t.span / t.user;
    o.pd = pd; o.ea = ea;
    o.user = v.b * pd;
    o.perDone = v.b;
    o.wasted = 0;
    o.agent = (1 - v.f) * v.b * pd - compute;
    o.span = v.f * v.b * pd - v.j * ea;
    o.spanPct = o.user &gt; 0 ? o.span / o.user : 0;
    return { t: t, o: o };
  }
  function set(id, txt, cls) { var n = document.getElementById(id); n.textContent = txt; n.className = &#x27;num&#x27; + (cls ? &#x27; &#x27; + cls : &#x27;&#x27;); }
  function render() {
    var v = {};
    ids.forEach(function (k) { v[k] = parseFloat(el[k].value); });
    document.getElementById(&#x27;p-o&#x27;).textContent = pct(v.p);
    document.getElementById(&#x27;n-o&#x27;).textContent = v.n;
    document.getElementById(&#x27;c-o&#x27;).textContent = usd(v.c);
    document.getElementById(&#x27;r-o&#x27;).textContent = usd(v.r);
    document.getElementById(&#x27;b-o&#x27;).textContent = usd(v.b);
    document.getElementById(&#x27;f-o&#x27;).textContent = pct(v.f);
    document.getElementById(&#x27;j-o&#x27;).textContent = usd(v.j);
    var m = model(v), t = m.t, o = m.o;
    set(&#x27;o-pd&#x27;, pct(t.pd)); set(&#x27;o-pd2&#x27;, pct(o.pd));
    set(&#x27;o-ea&#x27;, t.ea.toFixed(2)); set(&#x27;o-ea2&#x27;, o.ea.toFixed(2));
    set(&#x27;o-u1&#x27;, usd(t.user)); set(&#x27;o-u2&#x27;, usd(o.user));
    set(&#x27;o-uf1&#x27;, usd(t.perDone), t.perDone &lt; o.perDone ? &#x27;better&#x27; : &#x27;&#x27;); set(&#x27;o-uf2&#x27;, usd(o.perDone), o.perDone &lt; t.perDone ? &#x27;better&#x27; : &#x27;&#x27;);
    set(&#x27;o-w1&#x27;, usd(t.wasted), t.wasted &gt; 0.005 ? &#x27;worse&#x27; : &#x27;&#x27;); set(&#x27;o-w2&#x27;, usd(o.wasted));
    set(&#x27;o-a1&#x27;, usd(t.agent), t.agent &lt; 0 ? &#x27;worse&#x27; : &#x27;&#x27;); set(&#x27;o-a2&#x27;, usd(o.agent), o.agent &lt; 0 ? &#x27;worse&#x27; : &#x27;&#x27;);
    set(&#x27;o-s1&#x27;, usd(t.span), t.span &lt; 0 ? &#x27;worse&#x27; : &#x27;&#x27;); set(&#x27;o-s2&#x27;, usd(o.span), o.span &lt; 0 ? &#x27;worse&#x27; : &#x27;&#x27;);
    set(&#x27;o-sp1&#x27;, pct(t.spanPct)); set(&#x27;o-sp2&#x27;, pct(o.spanPct));
    var msg = [];
    if (o.agent &lt; 0) msg.push(&#x27;Paid on acceptance, &lt;b&gt;this agent loses money&lt;/b&gt; at its price. It must improve its acceptance rate, cut compute, or raise its price.&#x27;);
    else if (o.agent &gt; t.agent) msg.push(&#x27;This agent &lt;b&gt;earns more&lt;/b&gt; paid on acceptance than today.&#x27;);
    else msg.push(&#x27;This agent earns less paid on acceptance than today, because it no longer bills failed attempts.&#x27;);
    if (o.span &lt; 0) msg.push(&#x27;Span &lt;b&gt;loses money&lt;/b&gt; on this task: its fee does not cover the quality checks across retries. Route to agents that finish, or keep this task type metered.&#x27;);
    else msg.push(&#x27;Span keeps &lt;b&gt;&#x27; + usd(o.span) + &#x27;&lt;/b&gt; per task requested, against &#x27; + usd(t.span) + &#x27; today.&#x27;);
    if (t.wasted &gt; 0.005) msg.push(&#x27;Today the person pays &lt;b&gt;&#x27; + usd(t.wasted) + &#x27;&lt;/b&gt; per request for attempts that were rejected.&#x27;);
    document.getElementById(&#x27;verdict&#x27;).innerHTML = msg.join(&#x27; &#x27;);
  }
  ids.forEach(function (k) { el[k].addEventListener(&#x27;input&#x27;, render); });
  Array.prototype.forEach.call(document.querySelectorAll(&#x27;.presets button&#x27;), function (btn) {
    btn.addEventListener(&#x27;click&#x27;, function () {
      var p = presets[btn.getAttribute(&#x27;data-p&#x27;)];
      ids.forEach(function (k) { el[k].value = p[k]; });
      render();
    });
  });
  render();
})();
&lt;/script&gt;

&lt;section id=&quot;decisions&quot;&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;Your call&lt;/div&gt;
  &lt;h2&gt;Three decisions before anything is pushed&lt;/h2&gt;
  &lt;div class=&quot;decisions&quot;&gt;
    &lt;div class=&quot;decision&quot;&gt;
      &lt;div class=&quot;n&quot;&gt;1&lt;/div&gt;
      &lt;div&gt;
        &lt;h3&gt;Push the branch and open the pull request?&lt;/h3&gt;
        &lt;p&gt;Pushing makes the work visible to the other sessions and starts CI. Nothing reaches staging until the merge steward merges it.&lt;/p&gt;
        &lt;p class=&quot;rec&quot;&gt;&lt;b&gt;My recommendation: yes.&lt;/b&gt; All three commits stand alone, master still has both fee bugs, and every day the branch waits it falls further behind a fast-moving master (it fell 974 commits behind by 6 October and 536 more by 10 October, and another session took its migration number in between). It happened again: on 12 October Harness v2 (#2279) took 986, and by 17 October the branch was 243 commits behind. If you say yes, I renumber, rebase, rerun every check, then push straight away.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;decision&quot;&gt;
      &lt;div class=&quot;n&quot;&gt;2&lt;/div&gt;
      &lt;div&gt;
        &lt;h3&gt;Keep the first-year fee fix?&lt;/h3&gt;
        &lt;p&gt;Every first-year developer has been charged 20% instead of the 10% the whitepaper and the original migration promise. Keeping the fix lowers Span&#x27;s take on their earnings by half. Dropping it means removing one commit and keeping 20%; then the whitepaper should change instead.&lt;/p&gt;
        &lt;p class=&quot;rec&quot;&gt;&lt;b&gt;My recommendation: keep it.&lt;/b&gt; The 10% is published, so charging 20% is a broken promise to the developers you most want to attract.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;decision&quot;&gt;
      &lt;div class=&quot;n&quot;&gt;3&lt;/div&gt;
      &lt;div&gt;
        &lt;h3&gt;Refund developers already overcharged?&lt;/h3&gt;
        &lt;p&gt;The fix only changes future earnings. Past first-year earnings stay at 20%. A refund means re-crediting the difference to their pending balance with an audit record.&lt;/p&gt;
        &lt;p class=&quot;rec&quot;&gt;&lt;b&gt;My recommendation: check the size first.&lt;/b&gt; Developer payouts on staging don&#x27;t move real money yet, so the overcharge may be zero in practice. If any real money is affected, refund it. I can write that query once you decide.&lt;/p&gt;

&lt;section id=&quot;idea&quot;&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;Background&lt;/div&gt;
  &lt;h2&gt;The idea: pay for finished work, not effort&lt;/h2&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;The tweet you shared predicts AI will move from selling tokens (paying for effort, like ads paid per view) to selling finished tasks (paying for results, like ads paid per sale). Span is well placed for that move because it already holds the vendor accounts, reserves money before work starts, and runs a quality check on every attempt.&lt;/p&gt;
    &lt;p&gt;The full argument, a margin calculator and the five-step plan are in the strategy memo: &lt;a href=&quot;1-strategy-memo-and-blog-post.html&quot;&gt;Paid for Done&lt;/a&gt;. This branch is steps 1 and 2 of that plan: fix what&#x27;s wrong with fees, save each attempt&#x27;s verdict, and measure what pay-on-acceptance would change before changing anyone&#x27;s pay.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;found&quot;&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;What the code does today&lt;/div&gt;
  &lt;h2&gt;Span pays for every settled attempt, good or bad&lt;/h2&gt;
  &lt;div class=&quot;col&quot;&gt;&lt;p&gt;Read from current master. These are the facts the branch responds to.&lt;/p&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Finding&lt;/th&gt;&lt;th&gt;What it means&lt;/th&gt;&lt;th&gt;Branch&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Rejected work still earns&lt;/td&gt;&lt;td&gt;The earnings rule checks only that the fee settled. A rejected attempt pays the agent exactly like an approved one, and the user pays for every revision.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;measured, not yet changed&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;The quality verdict is thrown away&lt;/td&gt;&lt;td&gt;The quality check decides approve, revise, reject or escalate on every attempt, then only writes it to a debug log. The &lt;code&gt;quality_outcome&lt;/code&gt; column meant to hold it is never filled, because the fee is recorded before the check runs.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;fixed: saved per attempt&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;High-volume fee tier checks the wrong number&lt;/td&gt;&lt;td&gt;The 15% tier compared the unpaid balance, which every payout resets. Developers who cash out often never qualified.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;fixed&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;First-year fee tier never applies&lt;/td&gt;&lt;td&gt;A setting stored as 0 instead of 12 means &quot;younger than 0 months,&quot; which is never true. Every first-year developer pays 20%, not 10%.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;fixed, your call to keep&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Two currencies&lt;/td&gt;&lt;td&gt;The pricing page sells credits; the code charges in dollars.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill bad&quot;&gt;not in this branch&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Routing ignores real cost&lt;/td&gt;&lt;td&gt;The agent ranking uses a static per-call price, not what a finished task actually costs with that agent.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill bad&quot;&gt;not in this branch&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;

  &lt;div class=&quot;col&quot;&gt;&lt;p&gt;The two fee fixes change what developers are charged. The third commit changes no money at all: it saves information and adds a read-only report.&lt;/p&gt;&lt;/div&gt;

  &lt;article class=&quot;commit&quot;&gt;
    &lt;div class=&quot;head&quot;&gt;&lt;span class=&quot;sha&quot;&gt;56e4925801&lt;/span&gt;&lt;h3&gt;High-volume fee tier uses this month&#x27;s earnings&lt;/h3&gt;&lt;/div&gt;

        &lt;div class=&quot;before&quot;&gt;&lt;div class=&quot;k&quot;&gt;Before&lt;/div&gt;15% if the developer&#x27;s &lt;i&gt;unpaid balance&lt;/i&gt; is over $1,000. A developer who earned $5,000 this month but was paid out yesterday pays 20%.&lt;/div&gt;
        &lt;div class=&quot;after&quot;&gt;&lt;div class=&quot;k&quot;&gt;After&lt;/div&gt;15% if the developer&#x27;s &lt;i&gt;gross earnings this calendar month&lt;/i&gt; (UTC) are over $1,000. Resets on the 1st. If the lookup fails, the tier is skipped and logged instead of losing the earning.&lt;/div&gt;

    &lt;div class=&quot;head&quot;&gt;&lt;span class=&quot;sha&quot;&gt;f18c2c43e0&lt;/span&gt;&lt;h3&gt;Each attempt keeps its quality outcome, plus a shadow report&lt;/h3&gt;&lt;/div&gt;

      &lt;div class=&quot;ba&quot;&gt;
        &lt;div class=&quot;before&quot;&gt;&lt;div class=&quot;k&quot;&gt;Before&lt;/div&gt;The verdict on each attempt is logged and lost. There is no way to ask &quot;how much did we pay for rejected work?&quot;&lt;/div&gt;
        &lt;div class=&quot;after&quot;&gt;&lt;div class=&quot;k&quot;&gt;After&lt;/div&gt;Every attempt records what it came to. A report shows, per developer, what they were paid against what they would have been paid if only accepted work counted.&lt;/div&gt;
      &lt;/div&gt;
      &lt;h3&gt;Saving the outcome&lt;/h3&gt;
      &lt;ul&gt;
        &lt;li&gt;Migration 986 (it needs a new number: master took 986 on 12 October) adds two empty columns to the attempts table: the outcome (approve, revision, reject, escalate or failed) and when it was decided. It can be rolled back.&lt;/li&gt;
        &lt;li&gt;The outcome is saved &lt;i&gt;after&lt;/i&gt; Span settles the task, so it reflects what really happened. The code review caught that the raw quality check sometimes says &quot;approve&quot; for work that was actually treated as failed, too short, or needing revision.&lt;/li&gt;
        &lt;li&gt;The first outcome is kept if a result is delivered twice. If saving fails, it is logged and the task carries on.&lt;/li&gt;
      &lt;/ul&gt;
&lt;pre&gt;&lt;span class=&quot;add&quot;&gt;function attemptOutcome(resultStatus, gateStatus) {&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;  if (resultStatus === &#x27;failed&#x27;) return &#x27;failed&#x27;&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;  switch (gateStatus) {&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;    case &#x27;passed&#x27;:      return &#x27;approve&#x27;&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;    case &#x27;revision&#x27;:    return &#x27;revision&#x27;&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;    case &#x27;escalated&#x27;:&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;    case &#x27;unavailable&#x27;: return &#x27;escalate&#x27;&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;    case &#x27;failed&#x27;:      return &#x27;reject&#x27;&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;  }&lt;/span&gt;
&lt;span class=&quot;add&quot;&gt;}&lt;/span&gt;&lt;/pre&gt;
      &lt;h3&gt;The shadow report&lt;/h3&gt;
      &lt;p&gt;Run with &lt;code&gt;npx tsx scripts/payouts-acceptance-shadow.ts --days 30&lt;/code&gt; as the database admin role. It refuses any role that can&#x27;t see people&#x27;s send-backs, because there it would quietly overstate pay. It changes nothing. Each earning lands in one bucket, checked in this order:&lt;/p&gt;
      &lt;div class=&quot;tbl&quot;&gt;
        &lt;table&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Bucket&lt;/th&gt;&lt;th&gt;Rule&lt;/th&gt;&lt;th&gt;Would it be paid?&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Sent back by the person&lt;/td&gt;&lt;td&gt;The person sent this attempt back. Overrides an approval.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill bad&quot;&gt;withheld&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Accepted&lt;/td&gt;&lt;td&gt;The quality check approved it, or escalated it and the person kept it.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;paid&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Escalated&lt;/td&gt;&lt;td&gt;Sent to the person, not yet kept.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;undecided&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Failed&lt;/td&gt;&lt;td&gt;The agent reported failure.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill bad&quot;&gt;withheld&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Sent back by the check&lt;/td&gt;&lt;td&gt;Revision or rejection. A revision is a new attempt with its own outcome, so work fixed on the second try is paid once.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill bad&quot;&gt;withheld&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Unjudged&lt;/td&gt;&lt;td&gt;No outcome saved: before migration 986, or a result that never reached the quality check.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;undecided&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Unlinked&lt;/td&gt;&lt;td&gt;The earning doesn&#x27;t name an attempt (older earnings).&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill warn&quot;&gt;undecided&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p class=&quot;files&quot;&gt;migrations/986-execution-gate-outcome.sql + rollback · execution-result.handler.ts · tasks.repository.ts · payout-analytics.repository.ts · scripts/payouts-acceptance-shadow.ts · RESERVATIONS.md · reversibility.int.test.ts · execution-result.handler.test.ts&lt;/p&gt;
    &lt;/div&gt;
  &lt;/article&gt;
&lt;/section&gt;

&lt;section id=&quot;proof&quot;&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;How it was checked&lt;/div&gt;
  &lt;h2&gt;Tested on code and on a real database&lt;/h2&gt;

      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Check&lt;/th&gt;&lt;th&gt;Result&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Developer payout tests (vitest)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;298 pass&lt;/span&gt; New cases: monthly volume at, above and below the line; lookup failure; skipping the lookup when an earlier tier matches; first-year with the stored 0.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Result handler tests (jest)&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;174 pass&lt;/span&gt; New cases: approve, revision, reject, escalate, agent failure, too-short draft, &quot;needs revision&quot; result, failed save, no attempt id.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Migration on local Postgres&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;pass&lt;/span&gt; Applied twice without error, first outcome kept, invalid values refused, rollback leaves no trace. The rollback audit accepts it.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Shadow report on seeded data&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;exact&lt;/span&gt; One example row per bucket: $3.01 credited, $1.00 would pay, $1.55 withheld, $0.46 undecided, all matching a hand calculation. Run as a restricted role, it refused with a clear message. Test rows removed afterwards.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Monthly volume query&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill ok&quot;&gt;pass&lt;/span&gt; Counted the first second of the month, excluded the last second of the previous month, with the database set to a non-UTC time zone.&lt;/td&gt;&lt;/tr&gt;

      &lt;/tbody&gt;
    &lt;/table&gt;

    &lt;table&gt;

        &lt;tr&gt;&lt;td&gt;Fee-tier fix&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;86&lt;/td&gt;&lt;td&gt;Found the first-year bug (now its own commit). Asked for: no precision cap on the monthly total, a fallback when the lookup fails, and comments on how the tier behaves at the line and at month start. All done.&lt;/td&gt;&lt;/tr&gt;

&lt;section id=&quot;corrections&quot;&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;What changed along the way&lt;/div&gt;
  &lt;h2&gt;Things I got wrong or had to redo&lt;/h2&gt;
  &lt;ul class=&quot;col&quot;&gt;
    &lt;li&gt;&lt;b&gt;The verdict claim.&lt;/b&gt; My first answer and the first version of the memo said Span records approve/reject on every cost row. It doesn&#x27;t; the column is never filled. I corrected the memo the same day.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;The migration number, three times.&lt;/b&gt; I first reserved 900; master moved past 930, so I renumbered to 940. While the branch sat unpushed, another session landed its own 940 on master, so it became 986. On 12 October Harness v2 (#2279) landed its own 986 on master too, so the branch now conflicts in &lt;code&gt;RESERVATIONS.md&lt;/code&gt; and &lt;code&gt;rollback/986-rollback.sql&lt;/code&gt;. Master goes up to 1019 on 17 October. Only pushing right after renumbering protects the number.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;New on master: a person can accept an unchecked answer.&lt;/b&gt; Since 13 October (#2315), when the Judge is unsure and no second check is possible, Span asks the person whether to use the answer anyway. That path writes no kept verdict, so the shadow report would count such an attempt as &quot;escalated, not yet kept&quot; (undecided) when the person did in fact accept it. Fix during the rebase: treat a task ended as &lt;code&gt;accepted_by_person&lt;/code&gt; as accepted.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;The rebases.&lt;/b&gt; The branch fell 974 commits behind by 6 October and 536 more by 10 October. Each time it was rebased onto current master. The conflicts were in shared bookkeeping files and one import list, where I kept both sides. Master&#x27;s new &quot;Span&#x27;s own work&quot; path adds no outcome types my code misses. Every check was re-run after each rebase.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Page links.&lt;/b&gt; These pages are standalone files: they open in any browser, with no account, and link to each other inside this folder.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;One gap still open.&lt;/b&gt; I haven&#x27;t measured how often the quality check&#x27;s verdict agrees with people&#x27;s own keep-or-send-back. That needs real staging data, and it decides whether paying on the check&#x27;s verdict is fair.&lt;/li&gt;
  &lt;/ul&gt;
&lt;/section&gt;

<script>
const MAP={'1-strategy-memo-and-blog-post.html': 'memo', '2-branch-review.html': 'review', '3-picture-book.html': 'book'};
const keys=[...document.querySelectorAll('[role=tab]')].map(t=>t.dataset.k);
function fit(f){try{const d=f.contentDocument;f.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){}}
function show(k,anchor){
  if(!keys.includes(k))k=keys[0];
  keys.forEach(x=>{const on=x===k;document.getElementById('t-'+x).setAttribute('aria-selected',on);document.getElementById('t-'+x).tabIndex=on?0:-1;document.getElementById('p-'+x).hidden=!on});
  const f=document.querySelector('#p-'+k+' iframe');fit(f);
  if(anchor){const el=f.contentDocument&&f.contentDocument.getElementById(anchor);if(el){const top=el.getBoundingClientRect().top+f.getBoundingClientRect().top+scrollY-70;scrollTo({top});return}}
  scrollTo({top:0});
}
function route(){const h=location.hash.slice(1).split('/');show(h[0]||keys[0],h[1])}
document.querySelectorAll('[role=tab]').forEach(t=>{t.onclick=()=>{location.hash=t.dataset.k};t.onkeydown=e=>{const i=keys.indexOf(t.dataset.k);let n=null;if(e.key==='ArrowRight')n=keys[(i+1)%keys.length];if(e.key==='ArrowLeft')n=keys[(i+keys.length-1)%keys.length];if(n){location.hash=n;document.getElementById('t-'+n).focus()}}});
document.querySelectorAll('iframe').forEach(f=>{
  f.addEventListener('load',()=>{
    const d=f.contentDocument;fit(f);
    try{new ResizeObserver(()=>fit(f)).observe(d.body)}catch(e){}
    const k=f.parentElement.id.slice(2);
    d.addEventListener('click',e=>{
      const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
      const href=a.getAttribute('href');
      if(href.startsWith('#')){e.preventDefault();location.hash=k+'/'+href.slice(1);route()}
      else if(MAP[href.split('#')[0]]){e.preventDefault();const p=href.split('#');location.hash=MAP[p[0]]+(p[1]?'/'+p[1]:'')}
      else if(/^https?:/.test(href)){a.target='_blank';a.rel='noopener'}
    });
    if(location.hash.slice(1).split('/')[0]===k)route();
  });
});
addEventListener('hashchange',route);addEventListener('resize',()=>document.querySelectorAll('iframe').forEach(fit));
route();
</script></body></html>
