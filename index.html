&lt;section id=&quot;s11&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;11 · Blog post draft&lt;/div&gt;
    &lt;h2&gt;Paid for Done&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Draft&lt;/span&gt; Written in your voice for the Span blog, from sections 1 to 3, 5 and 10. It follows the format of your other posts (title, excerpt, suggested questions) and passes the publishing rules: no em dashes, no &quot;not X but Y&quot; contrasts, no slogan endings. About 1,180 words. A copy ready for &lt;code&gt;src/frontend/content/blog/posts/&lt;/code&gt; is saved at &lt;code&gt;~/.claude/plans/paid-for-done/paid-for-done-blog.md&lt;/code&gt;.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Field&lt;/th&gt;&lt;th&gt;Draft&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Title&lt;/td&gt;&lt;td&gt;Paid for Done&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Excerpt&lt;/td&gt;&lt;td&gt;AI is sold by the token today. It will be sold by the finished task. Span is moving to pay agents only for work people keep, with one published fee and a ranking that never favors whoever pays most.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Suggested questions&lt;/td&gt;&lt;td&gt;What does Span count as accepted work?&lt;br&gt;Why can&amp;#x27;t agents pay for a better spot in Span?&lt;br&gt;When does Span take a share of the value a task creates?&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;&lt;b&gt;Check before publishing.&lt;/b&gt; The second paragraph under &quot;Where Span stands&quot; says how Span pays today, including that a rejected attempt earns the same as an approved one. That is accurate and makes the change concrete, but it discloses current internals; cut that part if you would rather not. The 72-hour window, the published fee and the newcomer share are proposals, written as plans (&quot;will&quot;), not as shipped features. Add the link to Chamath&amp;#39;s post on X before it goes live.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;article class=&quot;col&quot; aria-label=&quot;Blog post draft&quot;&gt;
    &lt;p&gt;Chamath Palihapitiya summed up where the AI business stands in four lines. &quot;Most everyone is selling CPM. Cost per thousand tokens + markup.&quot; Next, he wrote, &quot;Everyone will sell CPA. Accomplish the task, participate in the ROI.&quot; On the way there he expects &quot;a lot of value destruction,&quot; and he points to the Web1 and mobile transitions as examples.&lt;/p&gt;
    &lt;h3&gt;From impressions to results&lt;/h3&gt;
    &lt;p&gt;He is talking about how AI is sold, and he borrows the terms from advertising. CPM is cost per mille, the price of a thousand impressions. An advertiser paid every time a banner was shown, whether anyone clicked or bought. CPA is cost per acquisition: the advertiser pays when someone signs up or buys. Advertising moved from the first to the second because buyers wanted to pay for outcomes, and the companies that could measure outcomes took the market. Google&#x27;s search ads moved to charging per click in 2002, and every year after, the measurement got closer to the sale.&lt;/p&gt;
    &lt;p&gt;AI is still in its banner-ad era. Model labs sell tokens, and most AI products resell those tokens with a markup, packaged as seats or credits. The buyer pays for effort. If an agent spends four dollars of compute and gets the work wrong, the buyer still pays four dollars, and pays again for the retry. Revenue grows with usage whether or not anything got done.&lt;/p&gt;
    &lt;p&gt;That pricing flatters the numbers investors look at. Revenue includes the token bill that passes straight through to the model provider. Gross margins look healthy because failed and repeated work is billed like good work. Run-rates multiply the best month by twelve, pilots and experiments included. Once buyers pay only for finished work, those numbers get restated, and some companies built on them will not survive it, which is the value destruction he expects.&lt;/p&gt;
    &lt;h3&gt;Where Span stands&lt;/h3&gt;
    &lt;p&gt;Span is the conversation people use to get work done across agents from many providers. A person describes the job, and Span does it itself or routes it to the specialist agent best suited to it. Span holds the provider accounts, pays the agents and bills the person. Every dollar spent on agent work passes through us, which makes Span exactly the kind of company that could count pass-through as revenue and call it growth. We want to build the version that holds up after the transition.&lt;/p&gt;
    &lt;p&gt;Today Span pays the way most of the market does. An agent&#x27;s attempt is charged at the cost the agent reports, and the developer is credited that amount minus our fee as soon as it lands. Our quality check, the Judge, reviews every attempt and decides whether to approve it, send it back for revision, reject it or hand it to the person. That verdict decides what the person sees. It does not yet decide who gets paid. A rejected attempt earns the same as an approved one, and each revision is billed as a new attempt.&lt;/p&gt;
    &lt;h3&gt;Paid for accepted work&lt;/h3&gt;
    &lt;p&gt;We are changing that. Span will pay agents for accepted work. Accepted means the Judge approves the work and the person keeps it. After delivery the person has a window, 72 hours to start, to send it back, and silence counts as keeping it. The agent&#x27;s earnings are held during the window and released when it closes. Failed attempts and rework are the agent&#x27;s cost. The person pays one price, quoted before the work starts, and only for work they keep.&lt;/p&gt;
    &lt;p&gt;This changes what a good agent is. Under token pricing, an agent that takes more steps earns more. Under acceptance pricing, the agent that gets the work right the first time, at a low cost, earns the most. Developers are paid for being right, which is the incentive they should have had from the start.&lt;/p&gt;
    &lt;h3&gt;A router nobody can buy&lt;/h3&gt;
    &lt;p&gt;It also changes what the router has to be. When agents choose the work, the router decides who gets hired. Advertising&#x27;s results era carries a warning here: it came with paid placement, and the top result in a search box was often the one that paid most. If agents could pay Span for position, or if Span ranked its own margin above the person&#x27;s interest, the person would be paying for a worse result in a less visible way.&lt;/p&gt;
    &lt;p&gt;Two rules sit underneath the change. Span charges one published fee per kind of task, the same for every agent, so it gains nothing by steering work toward one agent over another. And Span&#x27;s fee and margin are never inputs to the ranking. Agents are ranked on how well they fit the person&#x27;s taste, how often their work is accepted, and the real cost of a finished task, which includes the attempts that failed. An agent that is cheap per attempt but often sent back is expensive per finished task, and the ranking should see that.&lt;/p&gt;
    &lt;p&gt;The ranking also has to learn taste. A person&#x27;s agent will build habits from every verdict, learning which answers they keep and which they send back. That raises an open question about the agent economy. Demand could concentrate on a few superstar agents, because rational buyers converge on the same best product. Or it could spread out, because agents are good at drawing out each person&#x27;s particular preferences. We think a neutral router that learns each person&#x27;s taste pushes toward the second outcome, and we will give newer agents a measured share of work so the market stays open to them.&lt;/p&gt;
    &lt;h3&gt;The share of the value comes later&lt;/h3&gt;
    &lt;p&gt;&quot;Participate in the ROI&quot; is the step after that, and we are holding it back on purpose. Some tasks have a result you can count, such as a refund recovered or a meeting booked. For those, a share of the value is fair. Most tasks have no clean number. &quot;Help me think through my pricing&quot; has no finish line you can price as a percentage, and advertising showed what happens when payment rides on outcomes that are easy to claim: fake sign-ups, and credit taken for sales that would have happened anyway. We will start with fixed prices for work that can be checked, and add a share of the value only where the value can be counted.&lt;/p&gt;
    &lt;h3&gt;How we get there&lt;/h3&gt;
    &lt;p&gt;We are doing this in steps, and each one is useful by itself. First, Span keeps the Judge&#x27;s verdict on every attempt. Next, a shadow report shows each developer what they were paid against what acceptance-based pay would have paid, before any money moves. After that, earnings are held until acceptance, prices are quoted per task, and every agent gets a scorecard of its acceptance rate and one way to contest a send-back. When we report revenue, we will lead with what Span keeps after agents and model providers are paid.&lt;/p&gt;
    &lt;p&gt;Chamath closed with &quot;Good luck to all the players!&quot; The companies that come through this transition will be the ones already measuring results when buyers start asking for them. For a marketplace, that means paying for work people keep and making sure nobody can buy their way to the top.&lt;/p&gt;
  &lt;/article&gt;

  &lt;div class=&quot;eyebrow&quot;&gt;Span · pricing, payouts, routing and taste · strategy memo&lt;/div&gt;
  &lt;h1&gt;Paid for Done&lt;/h1&gt;
  &lt;p class=&quot;lede col&quot;&gt;Two shifts are coming at once. AI will be paid &lt;em&gt;for finished work&lt;/em&gt; instead of by the token, and AI agents will increasingly &lt;em&gt;decide who gets the work&lt;/em&gt; instead of people clicking the first result they see. Span sits where both meet: it finds agents, chooses one, hires it and pays it. This memo explains both shifts in full, records exactly what Span&#x27;s code does today, and specifies the version I&#x27;d build. Everything rests on one rule: Span must work for the person, not for whoever pays it most.&lt;/p&gt;
  &lt;div class=&quot;meta&quot;&gt;&lt;span&gt;Written 4 October 2026 · expanded 11 October 2026 · updated 17 October 2026&lt;/span&gt;&lt;span&gt;Every code fact checked on master 47f1687d69 (11 October), re-checked on 725d9beccc (17 October)&lt;/span&gt;&lt;span&gt;Prepared for Yousef&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;guide&quot;&gt;
    &lt;p&gt;&lt;b&gt;How to use this memo.&lt;/b&gt; It is the source for two things: a blog post and a product integration document. Every claim carries a label:&lt;/p&gt;
    &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;verified in Span&#x27;s code or docs, with the file in the Sources appendix. &lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt;what I recommend building. &lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;a question that needs your decision or real data.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;For the blog post:&lt;/b&gt; a full draft in your voice is in &lt;a href=&quot;#s11&quot;&gt;section 11&lt;/a&gt;. Its sources are sections 1 to 3 and the Risks, plus the source notes in Appendix A. They hold the argument, the examples and the language. Avoid the Fact sections about Span&#x27;s internals unless you want to disclose them.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;For the product document:&lt;/b&gt; sections 4 to 9 and Appendix C. They hold the current state, the target design, data and rules, the work order and the decisions.&lt;/p&gt;
    &lt;ol class=&quot;toc&quot;&gt;

&lt;!-- 1 --&gt;
&lt;section id=&quot;s1&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;1 · Shift one · how work is paid&lt;/div&gt;
    &lt;h2&gt;From paying for effort to paying for results&lt;/h2&gt;
    &lt;div class=&quot;tweet&quot;&gt;
      &lt;p&gt;&quot;Current State of the Union of AI/SI: Most everyone is selling CPM. Cost per thousand tokens + markup.&lt;/p&gt;
      &lt;p&gt;Future State of the Union of AI/SI: Everyone will sell CPA. Accomplish the task, participate in the ROI.&lt;/p&gt;
      &lt;p&gt;In the transition from CPM to CPA, we will debunk much of the current gamesmanship around revenues, gross margins and run-rates. This will necessarily involve a lot of value destruction. See Web1 and Mobile transitions for examples.&lt;/p&gt;
      &lt;p&gt;Good luck to all the players!&quot;&lt;/p&gt;
      &lt;p class=&quot;cite&quot; style=&quot;font-family: var(--body); font-size: 14px; color: var(--ink-3, var(--ink-2)); margin: 0;&quot;&gt;Chamath Palihapitiya, on X. The CPM and CPA definitions in this memo come from this post.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p&gt;Chamath Palihapitiya is a venture investor (Social Capital), a co-host of the All-In podcast and an early Facebook executive who ran its growth team. The post is about how AI is priced: what model labs, AI apps and agents charge for. It borrows two terms from online advertising as shorthand; it is not about advertising itself. It makes four short claims. Here is what each line means:&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;The line&lt;/th&gt;&lt;th&gt;What it means&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&quot;Current State of the Union of AI/SI&quot;&lt;/td&gt;&lt;td&gt;Where the AI business stands today. &quot;SI&quot; most likely means superintelligence; he is talking about everyone who sells AI, from model labs to the apps built on them.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;Most everyone is selling CPM. Cost per thousand tokens + markup.&quot;&lt;/td&gt;&lt;td&gt;Today almost every AI company is paid for usage. Model labs sell tokens by the thousand or million; most AI apps and agents buy those tokens and resell them with a markup, priced per seat, per credit or per call. Revenue rises with how much the AI is used, whether or not the work succeeds.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;Everyone will sell CPA. Accomplish the task…&quot;&lt;/td&gt;&lt;td&gt;The price will attach to the finished job instead of the effort: a fixed fee per completed task, owed only if the task is done.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;…participate in the ROI.&quot;&lt;/td&gt;&lt;td&gt;The step past that: the seller takes a share of what the work was worth to the buyer (money recovered, sales made, hours saved), like a commission or a performance fee.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;…debunk much of the current gamesmanship around revenues…&quot;&lt;/td&gt;&lt;td&gt;Revenue is flattered because many companies count the full token bill they pass through to model providers as their own revenue.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;…gross margins…&quot;&lt;/td&gt;&lt;td&gt;Margins look healthy because cost simply passes to the buyer with a markup, and failed or repeated work is billed too. Under CPA the seller pays for its own failures, so the margin shows how good the product really is.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;…and run-rates.&quot;&lt;/td&gt;&lt;td&gt;A run-rate is one month&amp;#39;s revenue multiplied by twelve. It is inflated by pilots, experiments and one-off spending that may not repeat. Paying per finished task shows what customers keep paying for.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;This will necessarily involve a lot of value destruction.&quot;&lt;/td&gt;&lt;td&gt;Company valuations built on those flattering numbers will fall when the numbers are restated on results. Some companies will shrink and some will not survive.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;See Web1 and Mobile transitions for examples.&quot;&lt;/td&gt;&lt;td&gt;It has happened before. He does not name the examples; the likely ones are the dot-com bust (2000 to 2002), when companies valued on traffic and page views collapsed once the market priced on revenue and profit, and the move to phones, when companies that led on desktop and did not adapt lost their place to those built for mobile.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&quot;Good luck to all the players!&quot;&lt;/td&gt;&lt;td&gt;A dry sign-off: nobody now selling AI is safe from the shift, including the biggest names.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;&lt;b&gt;Why it matters to Span.&lt;/b&gt; A broker is exactly where this &quot;gamesmanship&quot; can hide. If Span reported every dollar that passes through it to agents and model providers as its own revenue, it would be showing CPM-style numbers. The memo&amp;#39;s answer is to be paid for accepted work and to report revenue net of what goes to agents and providers (see &quot;How Span reports revenue&quot; in &lt;a href=&quot;#s5&quot;&gt;section 5&lt;/a&gt;).&lt;/p&gt;
    &lt;p&gt;He uses them about AI, but the two terms come from online advertising. &lt;b&gt;CPM&lt;/b&gt; (cost per mille, meaning per thousand) is paying for every thousand times an ad is shown, whether anyone buys. &lt;b&gt;CPA&lt;/b&gt; (cost per acquisition) is paying only when someone actually signs up or buys. Advertising moved from the first to the second because buyers wanted to pay for results, and the companies that could measure results (Google, Facebook) took the market.&lt;/p&gt;
    &lt;p&gt;In AI, &quot;CPM&quot; is selling tokens: the chunks of text a model reads and writes, priced per thousand or per million with a markup on top. The buyer pays for the agent&#x27;s effort. If it burns $4 of tokens and fails, the buyer still pays $4. &quot;CPA&quot; means the buyer pays when the task is done. &quot;Participate in the ROI&quot; (return on investment) goes one step further: take a share of the value the task created.&lt;/p&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;&lt;b&gt;What the two terms mean at Span.&lt;/b&gt;&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;CPM at Span (how it works today)&lt;/b&gt; &lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt; Span pays for effort. Each attempt an agent makes is charged at the agent&amp;#39;s reported cost, and the developer is credited that amount minus Span&amp;#39;s fee (10%, 15% or 20%) before the quality check has run. An attempt the Judge rejects is charged and credited exactly like one it approves, and every revision is another fully charged attempt. The &quot;markup&quot; in the tweet is Span&amp;#39;s fee on the agent&amp;#39;s side, plus margins on some tools (Brave Search is listed at cost plus 50%).&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;CPA at Span (the proposal)&lt;/b&gt; &lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt; Span pays for accepted work. The &quot;acquisition&quot; is an accepted task: the Judge approves it and the person doesn&amp;#39;t send it back within the window (say 72 hours; saying nothing counts as yes). The person pays one price, quoted before the work starts, and only for accepted work. The agent&amp;#39;s earnings are held until then and released on acceptance. Failed attempts and rework cost the agent, not the person. Span&amp;#39;s fee stays the same published share for every agent, so Span gains nothing by steering work to one agent over another.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;&quot;Participate in the ROI&quot; at Span&lt;/b&gt; &lt;span class=&quot;lbl p&quot;&gt;Proposal, later&lt;/span&gt; Charging a share of the money a task made or saved. Only for tasks whose result can be counted, such as a refund recovered or a meeting booked, and only once fixed-price tasks work.&lt;/p&gt;
    &lt;/div&gt;
    &lt;p&gt;The &quot;value destruction&quot; line is the sharp part. Much reported AI revenue is token resale that passes straight through to model providers. Gross margins look healthy only because nobody asks whether the work succeeded. Once buyers pay only for results, agents that don&#x27;t reliably finish will see revenue fall away, and some headline &quot;run-rates&quot; (this month&#x27;s revenue multiplied by twelve) will turn out to have been compute resale. The tweet compares it to the Web1 and mobile transitions, when many companies that looked big did not survive a change in how money flowed.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;now&quot;&gt;
      &lt;div class=&quot;tag&quot;&gt;Today · per token&lt;/div&gt;
      &lt;div class=&quot;big&quot;&gt;Buyer carries the risk&lt;/div&gt;
      &lt;p&gt;Failed and retried work is billed. A seller earns more when its agent takes more steps. Revenue looks big because it includes the model provider&#x27;s share.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;next&quot;&gt;
      &lt;div class=&quot;tag&quot;&gt;Next · per finished task&lt;/div&gt;
      &lt;div class=&quot;big&quot;&gt;Seller carries the risk&lt;/div&gt;
      &lt;p&gt;Only accepted work is billed. A seller earns more when its agent succeeds cheaply. Revenue is smaller but real, and the margin reflects how well the seller does the job.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;&lt;b&gt;Where the tweet goes too far.&lt;/b&gt; &quot;Everyone will sell CPA&quot; assumes every task has a result that can be measured. Many don&#x27;t: &quot;help me think through my pricing&quot; has no clear finish line. And advertising&#x27;s CPA era also brought fake sign-ups and companies claiming credit for sales that would have happened anyway. The durable version is a mix: fixed price where results can be checked, metered pricing where they can&#x27;t, and a share of the value only where the value can be counted.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 2 --&gt;
&lt;section id=&quot;s2&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;2 · Shift two · who decides&lt;/div&gt;
    &lt;h2&gt;Agents will decide who gets the work&lt;/h2&gt;
    &lt;p&gt;The second shift is about demand: who chooses what gets bought and who gets hired. Today that choice is made by people with limited time, steered by search rankings and ads. Personal agents change who does the choosing, and that changes what companies have to be good at. Much of this argument assumes personal agents will be on the consumer&#x27;s side; section 2.7 is about what happens if they aren&#x27;t.&lt;/p&gt;

    &lt;h3&gt;2.1 Companies out-think their customers today&lt;/h3&gt;
    &lt;p&gt;Companies are in some sense the original superintelligence. A company pools the thinking of many people and spreads that cost over millions of customers, which lets it push its own interests against those of some customers. Relative to a company&#x27;s capacity to optimize, a customer is often inattentive, under-informed, rushed or irrational. The economist Herbert Simon called this &lt;b&gt;bounded rationality&lt;/b&gt;, and firms often benefit from it.&lt;/p&gt;
    &lt;p&gt;Think about booking a flight. The airline has whole teams studying behavior, testing prices and learning when you&#x27;re most likely to buy extras. You are one person who doesn&#x27;t have time to compare every airline, read every insurance policy or understand every fee. The classic example is the travel-insurance upsell at the end of a booking, usually priced well above what a regular policy would cost. Now give that person an agent that does the research, knows the tricks and reads the fine print. The customer becomes much harder to exploit, and people will deal with companies somewhat more rationally.&lt;/p&gt;

    &lt;h3&gt;2.2 Some business models stop working&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Price discrimination works less well.&lt;/b&gt; Two people buy the same product. One spends 20 minutes finding a discount code and pays $80; the other doesn&#x27;t bother and pays $100. Coupons work because only some people hunt for them. If every agent hunts fastidiously for every coupon, the coupon stops separating customers.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Hidden cross-subsidies change.&lt;/b&gt; Today, people who forget to cancel subscriptions (streaming, gyms, software) subsidize people who remember. Agents cancel what isn&#x27;t used.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Upsells lose their edge.&lt;/b&gt; An add-on that sells only because the buyer is rushed stops selling when the buyer&#x27;s agent isn&#x27;t rushed.&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;Across the whole economy it isn&#x27;t clear who ends up better or worse off. Economists call this the &lt;b&gt;incidence&lt;/b&gt;: some prices that were low because other people overpaid may rise.&lt;/p&gt;

    &lt;h3&gt;2.3 Better products beat better marketing more often&lt;/h3&gt;
    &lt;p&gt;Corporate strategists have long argued over what matters more, distribution or product quality. You may have built something better, but does anyone know about it? Won&#x27;t people just keep buying the ACME Corp mousetrap? Personal agents act as a &lt;b&gt;structural subsidy for product quality&lt;/b&gt;. Imagine a market where every buyer spent at least ten hours researching every purchase; that is roughly what agents make possible. On the margin, making the product better becomes a more effective strategy than buying more distribution.&lt;/p&gt;
    &lt;p&gt;An example. Company A makes average headphones but spends millions on ads, influencers and appearing first on Amazon. Company B makes better headphones (better sound, longer battery, lower price) and barely advertises. Today A often wins because more people know about it. With an agent that compares independent reviews and specifications for each buyer&#x27;s needs, the agent may recommend B even if the buyer has never heard of it. Instead of another $10 million on ads, a company may get more from spending it on the product.&lt;/p&gt;

    &lt;h3&gt;2.4 Reliable information about quality becomes very valuable&lt;/h3&gt;
    &lt;p&gt;Most people don&#x27;t read 500 reviews before buying. An agent can: it can compare thousands of reviews, look at return rates, track performance and spot recurring complaints. A small company&#x27;s product might fail 2% of the time while a famous competitor&#x27;s fails 15% of the time; most people would never find that out, and an agent could. The smarter agents get, the more valuable trustworthy quality data becomes, and the more room there is for businesses that collect, verify and organize it.&lt;/p&gt;

    &lt;h3&gt;2.5 Paid placement loses some of its value&lt;/h3&gt;
    &lt;p&gt;Many internet companies make money by routing demand, and that routing often depends on short attention spans: &quot;I&#x27;ll click on the first thing I see.&quot; This creates waste, as companies try to please capricious ranking algorithms and pay placement fees. It isn&#x27;t all wasted, because a seller&#x27;s willingness to pay for placement is itself a signal that is worth something to buyers, but it&#x27;s a weak signal.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Today&lt;/th&gt;&lt;th&gt;With personal agents&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;The person searches for headphones.&lt;/td&gt;&lt;td&gt;The person asks their agent for headphones.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Google or Amazon ranks the results, partly by who paid.&lt;/td&gt;&lt;td&gt;The agent researches and compares products against the person&#x27;s needs.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;The person clicks a prominent result.&lt;/td&gt;&lt;td&gt;The agent recommends the best fit.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;If agents become the main way people discover and buy, paying to appear first becomes less valuable. Companies instead have to convince agents their product deserves recommending. Routing becomes more personal, reflecting each person&#x27;s taste, alongside whatever ranked placement still carries real information. For services in particular, routing should be neutralized: take the person&#x27;s preferences and choose on that basis alone. The open question is whether agent platforms will start charging companies for recommendations. That leads to section 2.7.&lt;/p&gt;

    &lt;h3&gt;2.6 Superstars or spread?&lt;/h3&gt;
    &lt;p&gt;A big open question is whether agents increase &lt;b&gt;superstar effects&lt;/b&gt;, where rational agents all settle on the same product, or increase &lt;b&gt;dispersion&lt;/b&gt;, where purchases spread out because everyone has slightly different tastes and preferences. Agents are good at drawing those out, which could finally undo the artificial clustering that rankings and ads have pushed everyone into.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;pair&quot;&gt;
    &lt;div class=&quot;now&quot;&gt;
      &lt;div class=&quot;tag&quot;&gt;Possibility A · superstars&lt;/div&gt;
      &lt;div class=&quot;big&quot;&gt;Everyone buys the winner&lt;/div&gt;
      &lt;p&gt;If one laptop is better on paper than every rival, millions of agents recommend it and the leading company grows even more dominant.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;next&quot;&gt;
      &lt;div class=&quot;tag&quot;&gt;Possibility B · spread&lt;/div&gt;
      &lt;div class=&quot;big&quot;&gt;Everyone buys their fit&lt;/div&gt;
      &lt;p&gt;Your agent knows you care about battery life; mine knows I care about the screen; someone else&#x27;s knows they need the lightest laptop. Each gets a different best answer, and smaller specialized companies can win.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;Nobody knows yet which effect will be stronger.&lt;/p&gt;

    &lt;h3&gt;2.7 Everything depends on whose side the agent is on&lt;/h3&gt;
    &lt;p&gt;What if your agent doesn&#x27;t recommend the best product, but the one whose maker pays the agent&#x27;s operator the highest commission? Then the old problem is back: instead of sponsored search results we get sponsored recommendations, and the person still can&#x27;t tell whether the advice is good. The whole argument depends on personal agents genuinely representing their users. An agent that works for you optimizes for what you want, not for what earns its operator the most.&lt;/p&gt;

    &lt;h3&gt;2.8 The economy&#x27;s feedback gets more accurate&lt;/h3&gt;
    &lt;p&gt;Think of the market as a huge machine that decides how much value each product and company deserves. Today the machine is imperfect: excellent products fail because nobody finds them, and mediocre products succeed because of excellent distribution. Better-informed buyers make it more accurate. In machine-learning terms, this improves the economy&#x27;s &lt;b&gt;backpropagation&lt;/b&gt;: companies get clearer feedback about what people actually value, and better products receive larger rewards.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 --&gt;
&lt;section id=&quot;s3&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;3 · What this means for Span&lt;/div&gt;
    &lt;h2&gt;Span is the agent that hires agents, so it has to be on the person&#x27;s side&lt;/h2&gt;
    &lt;p&gt;The argument above is mostly about shopping. Span&#x27;s opportunity is related but broader. Picture someone who simply tells their AI, &quot;Build me a website for my business.&quot; Instead of searching for website builders, comparing freelancers and vetting agencies, their AI finds and picks the best specialized agent for the job. The same goes for tax returns, video editing, contract review, research and other digital work. &lt;b&gt;The competition moves from being discovered by people to being selected by agents.&lt;/b&gt; Span&#x27;s core claim is exactly this: people say what they want, and Span works out who should do it, even when the person doesn&#x27;t know who that is. That role has three jobs:&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Job&lt;/th&gt;&lt;th&gt;What it means&lt;/th&gt;&lt;th&gt;Where Span is&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Discovery&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Find every agent and tool that can do the task.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Built: federated discovery across registries and providers.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Selection&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Pick the best one for &lt;i&gt;this&lt;/i&gt; person on quality, price, reliability and fit with their needs.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Partly built: SpanRank. Its per-person taste signal learns only from approvals and has zero weight under the default settings (section 4).&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Execution&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Hire it, pay it, check the work, deliver the result.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Built, but pays for effort: every settled attempt is paid, good or bad. Shift one fixes this.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;Span&#x27;s opportunity is to be the infrastructure that lets demand find, and do business with, the best available AI services. This only works because of a decision you already made: &lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt; people never bring their own vendor keys. Span holds the accounts, pays providers, and is the merchant of record, reselling the work. That places Span alongside platforms that take a published cut of work they front (OpenRouter is one example), not alongside zero-margin pass-throughs.&lt;/p&gt;
    &lt;p&gt;One distinction matters more than anything else in this memo: &lt;b&gt;routing doesn&#x27;t automatically reward quality. It rewards whatever the routing system is built to optimize.&lt;/b&gt; Optimize for commissions and Span recreates sponsored search. Optimize for verified outcomes and the person&#x27;s own interests and quality becomes a real competitive advantage. In an economy where agents increasingly decide what to buy and whom to hire, the systems that discover, judge and route demand may become as important as the products and services themselves. Four rules follow.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;rules&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;Rule 1 · neutral routing&lt;/div&gt;
      &lt;h3&gt;Nobody can buy a better rank, including Span&lt;/h3&gt;
      &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The whitepaper already says &quot;the platform has no commercial levers to tilt a rank outcome in exchange for provider revenue,&quot; and nothing in the ranking code reads money paid to Span.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt;Extend it to Span&#x27;s own money: the ranking never sees Span&#x27;s fee or margin. One published fee per kind of task, the same for every agent. No paid placement and no sponsored slots, ever, enforced by a test.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;Rule 2 · learn the person&#x27;s taste&lt;/div&gt;
      &lt;h3&gt;Selection gets more personal with every verdict&lt;/h3&gt;
      &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt;When a person&#x27;s agent deals with other agents on their behalf, it should build up the same taste and habits the person would: preferred styles, trusted agents, things they always reject. Every keep or send-back is a lesson. In reinforcement-learning terms, each verdict is a reward signal that tunes the selector to this person.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Today the signal learns only from approvals, files every task as &quot;general&quot;, and counts for nothing under default weights.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;Rule 3 · keep the market open&lt;/div&gt;
      &lt;h3&gt;Push toward spread, not superstars&lt;/h3&gt;
      &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt;Give new specialists real chances, and track how concentrated work is per kind of task. If one agent takes almost everything for reasons other than fit, that&#x27;s a warning sign.&lt;/p&gt;
      &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;A &quot;discovery bonus&quot; (one request in ten goes to a promising newer agent) exists in the code and is cited by the whitepaper, but nothing calls it. It is switched off.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;Rule 4 · make quality visible&lt;/div&gt;
      &lt;h3&gt;Verified outcomes are the quality data&lt;/h3&gt;
      &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt;Acceptance rates per agent and per kind of task are exactly the trustworthy quality information agents need. Show each agent its own scorecard, including common reasons people send its work back, so improving the product is clearly the winning move.&lt;/p&gt;
      &lt;p&gt;This only works if acceptance is measured honestly, which is why shift one (pay on acceptance) and shift two (route on quality) must read the same verdicts.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 --&gt;
&lt;section id=&quot;s4&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;4 · Where Span is today&lt;/div&gt;
    &lt;h2&gt;Span is free, pays agents for every settled attempt, and ranks without price or taste&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt; Span sells no plans. Subscription plans and the pricing page were removed in early October (&quot;Span is free&quot;). The money that moves today is for paid agents and tools that Span buys on the person&#x27;s behalf. Here is how money moves for one agent attempt. The plumbing is careful: reservations, a ledger written once per attempt, idempotent Stripe payouts, and a drift check that halts payouts if the books disagree. But the one input that says whether the work was any good is decided and then thrown away.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;flow-frame&quot;&gt;
    &lt;div class=&quot;cap&quot;&gt;One agent attempt, master 725d9beccc (17 October)&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Estimate&lt;/b&gt;Lowest, average and highest past cost for this agent (or its type); confidence from sample size.&lt;span class=&quot;mono&quot;&gt;cost-estimator.service.ts&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Reserve&lt;/b&gt;Held against the project budget under a row lock; over the cap asks the person. Off by default.&lt;span class=&quot;mono&quot;&gt;billing.service.ts enforceBudgetCap&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Run + settle&lt;/b&gt;Charged what the agent &lt;i&gt;reports&lt;/i&gt;; the developer is credited right then.&lt;span class=&quot;mono&quot;&gt;billing.cost_entries&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;step bad&quot;&gt;&lt;b&gt;Quality verdict&lt;/b&gt;Approve, revise, reject or escalate is decided, written to a debug log, and dropped.&lt;span class=&quot;mono&quot;&gt;execution-result.handler.ts → tasks.addCost&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Earn&lt;/b&gt;Developer gets cost × (1 − fee).&lt;span class=&quot;mono&quot;&gt;attempt-earnings.ts · earnings-listener.ts&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;b&gt;Pay out&lt;/b&gt;Stripe Connect transfer, triggered by hand.&lt;span class=&quot;mono&quot;&gt;payout.service.ts&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;&lt;h3&gt;4.1 Pricing and charging&lt;/h3&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Piece&lt;/th&gt;&lt;th&gt;What the code does&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Plans&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;None. &quot;Span sells no plans&quot;; Stripe subscription events are acknowledged and ignored. The pricing page redirects to the home page.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Estimate&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Built from the lowest, average and highest past &lt;code&gt;cost_usd&lt;/code&gt; for the agent, or its agent type. Confidence is high with 10 or more samples, medium with 3 or more, else low or unavailable. With backups on, the worst case allows for 3 revisions across 2 agents. There is no fixed rate card: the static &lt;code&gt;cost_per_call&lt;/code&gt; is &quot;not the settlement basis.&quot;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Budget hold&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Reserves the estimate on &lt;code&gt;core.project_budgets&lt;/code&gt; with &lt;code&gt;SELECT … FOR UPDATE&lt;/code&gt;, settles to actual, releases on cancel. Over the cap it raises a &lt;code&gt;BUDGET_EXCEEDED&lt;/code&gt; decision. Live only when &lt;code&gt;BUDGET_CAP_ENFORCEMENT_ENABLED&lt;/code&gt; is on; it defaults to off.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Settlement&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The person is charged what the agent reports it spent. Cost attribution for the orchestrator is behind &lt;code&gt;BILLING_COST_ATTRIBUTION_ENABLED&lt;/code&gt;, default off.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Span&#x27;s own model calls&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The planner, Judge and Verifier are Span&#x27;s cost: recorded on &lt;code&gt;core.tasks.span_inference_cost&lt;/code&gt;, &quot;recorded and shown, never charged against the person&#x27;s budget.&quot; Rows appear only when the engine reports usage.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Paid tools&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Prepaid credit ledger with reasons limited to top-up, tool call, refund and adjustment. A price is held for 300 seconds before a call and charged &quot;per successful call&quot;; an error releases the hold. Brave Search is listed at 7,500 microdollars a call (5,000 wholesale &quot;plus a 50% margin&quot;) but has no endpoint, so Span pays Brave and cannot bill for it.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Other caps&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Per-role caps on Span&#x27;s own model calls refund a reservation when a call fails, except a timeout after sending, which counts as an unknown charge. Request-group caps return &lt;code&gt;over_group_cap&lt;/code&gt;.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Quotes&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The wallet&#x27;s quote is &quot;a binding price, bound before dispatch,&quot; signed with an HMAC over the user, execution, payee, rail, cap, expiry and more, and &quot;a CUMULATIVE spending cap for one logical call.&quot; The wallet (x402 and MPP rails) is off by default and set to testnet.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Gateway fees&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;&lt;code&gt;gateway_fee_micro&lt;/code&gt; records a gateway&#x27;s own fee (an aggregator&#x27;s cut), separately from the provider&#x27;s charge. It is not Span&#x27;s fee. &lt;code&gt;externally_billed&lt;/code&gt; marks money billed by a vendor to the person&#x27;s own account, which never passes through Span.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Fee copy&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;The legal page says &quot;Span adds no fee of its own to what you pay.&quot; That conflicts with Brave&#x27;s 50% margin and with the merchant-of-record plan to charge a stated fee. One of them must change before any fee ships.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;&lt;h3&gt;4.2 Paying agents and developers&lt;/h3&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Piece&lt;/th&gt;&lt;th&gt;What the code does&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Fee rates&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Agent revenue share defaults to 80%; developer platform fee defaults to 20%. Tiers in &lt;code&gt;billing.fee_tiers&lt;/code&gt;: year one 10% (priority 10), high volume over $1,000 at 15% (priority 20), default 20% (priority 100). First match wins.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Year-one bug&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The seed stores year one&#x27;s &lt;code&gt;min_months&lt;/code&gt; as 0, so &quot;younger than 0 months&quot; never matches: every first-year developer pays 20%, not 10%.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Volume bug&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The high-volume tier compares the developer&#x27;s unpaid balance, which every payout resets, not their monthly volume.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Whitepaper&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Describes 10% for the first twelve months, 15% in any month with over $1,000 in volume, 20% after. The code does neither of the first two correctly.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Earning&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;A settled agent-fee row becomes one ledger row per attempt, then a developer earning (net = gross × (1 − fee)), raising the pending balance. Span-owned rows and open rows (unknown, estimated, reserved) earn nothing.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Payout&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Writes a payout intent first, then a Stripe Connect transfer using the intent as the idempotency key. Halts if the earnings audit and stored balance disagree. Default minimum $25, default schedule monthly, but the schedule is &quot;stored as preference only&quot;: payouts are triggered by hand. &quot;Developer payouts in staging issue no real money.&quot;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Verdict and pay&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The earnings rule checks only that a row is a settled agent fee above zero with an attempt id. &lt;code&gt;cost_entries.quality_outcome&lt;/code&gt; (migration 428) is never written by anything, because the fee row lands before the quality check runs. A rejected attempt earns exactly like an approved one. Still true on 17 October.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Person accepts an unchecked answer&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt; New on 13 October (#2315). When the Judge is unsure and no second check can be made, Span holds the answer and asks the person in the app: use it anyway, try again (cost shown) or cancel. Only for research, writing, data analysis, design and other; never code, computer access or customer messages. If the person uses it, the task completes with a &quot;not double-checked&quot; line, Span learns nothing from it, the agent&amp;#39;s measured record is unchanged, and a separate &lt;code&gt;unverified_accepted&lt;/code&gt; count goes up. No kept verdict is written to &lt;code&gt;core.work_verdicts&lt;/code&gt;, and the agent earns for the attempt as it would for any other. &lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt; Under pay-on-acceptance, this answer was accepted by the person, so it should pay; the branch&amp;#39;s shadow report does not see it yet (see section 9).&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Rework&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Every revision is a fully billed attempt. TODOS.md records that, with a provider account out of credit, &quot;every task ran three paid agent revisions and then failed with &#x27;rejected by judge after 3 revisions&#x27;.&quot;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Refunds&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Only top-up refunds exist. No disputes, escrow or release on acceptance.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;col&quot;&gt;&lt;h3&gt;4.3 Ranking and taste&lt;/h3&gt;&lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Weight on&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Default (&quot;mvp&quot;)&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;&quot;phase2&quot;&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;&quot;coldstart&quot;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Relevance to the task&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.25&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.18&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.22&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Trust (reputation, verification, tenure, compliance)&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.25&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.18&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.22&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Performance (success rate, latency, consistency)&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.25&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.13&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.22&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cost&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.00&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.10&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.00&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Health&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.05&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.09&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.04&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Simulation (predicted quality)&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.05&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.05&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.10&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Skill confidence&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.15&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.09&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.15&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;User satisfaction (ratings)&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.00&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.08&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.05&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;User preference (taste)&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;&lt;b&gt;0.00&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;&lt;b&gt;0.10&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;0.00&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;ul class=&quot;findings&quot;&gt;
    &lt;li&gt;&lt;span class=&quot;sev md&quot;&gt;Weights&lt;/span&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The default setting is &quot;mvp&quot; (in code and in the example environment). It gives price and taste zero weight. The setting can be changed per organization at runtime, so I couldn&#x27;t see the live value on staging. &lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Which setting does staging run?&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;src/core/types/agent.ts MVP_WEIGHTS / PHASE2_WEIGHTS / COLDSTART_WEIGHTS · env SPANRANK_PHASE default &#x27;mvp&#x27; · feature-flags.ts&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;sev md&quot;&gt;Cost term&lt;/span&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Cost = estimated cost ÷ remaining budget, capped at 1, from the agent&#x27;s static per-call price. An unknown price earns no credit and is never scored as free. It measures price per call, not the cost of a finished task.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;spanrank-scorer.ts calculateCost&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;sev md&quot;&gt;Taste signal&lt;/span&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;Each approval raises a per-person, per-agent score that fades with a 30-day half-life, scaled by approvals ÷ 10 so one approval can&#x27;t dominate. With no history it returns 0, so it never penalizes a newcomer. It learns only from approvals (task completion and decision approval), never from a send-back or its reason, and every task is filed as &quot;general&quot; (a task-type classifier exists elsewhere but isn&#x27;t connected here).&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;user-preference-hook.ts · discovery.repository.ts&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;sev md&quot;&gt;Newcomers&lt;/span&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;The discovery bonus (10%, reproducible per person and task, promoting the best-scored agent with under 50 uses) has no caller since a ranking-policy change. It is switched off, though the whitepaper still cites it.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;spanrank-scorer.ts applyDiscoveryBonus · whitepaper&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;sev lo&quot;&gt;Trust&lt;/span&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;New agents in the sandbox need a 0.6 passing score and start between 0.5 and 0.7 trust. The engine assumes 0.5 trust and 0.5 health with no history. Progressive trust moves a person-and-task-type pair up a level after 5, 10 and 20 successes, and changes how often the person is asked to approve. It doesn&#x27;t touch pricing or fees.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;developer.types.ts SANDBOX_LIMITS · db_agent_selector.rs · migration 220&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li&gt;&lt;span class=&quot;sev lo&quot;&gt;Neutrality&lt;/span&gt;&lt;div&gt;&lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt;No paid placement exists anywhere in the ranking code, and the whitepaper calls neutral ranking a falsifiable bet: anyone can inspect the scorer, its inputs and the payouts.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;whitepaper Bet 1&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/section&gt;

&lt;!-- 5 --&gt;
&lt;section id=&quot;s5&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;5 · The best version&lt;/div&gt;
    &lt;h2&gt;Span buys finished work for the person, at a published price&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt; Put the two shifts and the four rules together. The person describes a task. Span ranks agents on what matters to &lt;i&gt;this&lt;/i&gt; person: fit with their taste, verified quality, and the price of a finished task. The person sees one price before work starts. The agent is paid only when the work is accepted. Span earns one published fee on finished work and pays for its own quality checks, so it does best by finishing work people keep.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;rules&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;The person&lt;/div&gt;
      &lt;h3&gt;One price, quoted up front, owed only on acceptance&lt;/h3&gt;
      &lt;p&gt;Before work starts, the person sees &quot;This costs $2.10.&quot; The money is reserved, as today. If the work is accepted, it settles. If Span can&#x27;t deliver within its retry limit, the reservation is released and nothing is charged.&lt;/p&gt;
      &lt;p&gt;Revisions, retries and quality checks never appear on the bill.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;The agent&lt;/div&gt;
      &lt;h3&gt;Commits to a price per kind of task, paid on acceptance&lt;/h3&gt;
      &lt;p&gt;An agent says &quot;I&#x27;ll do a research brief for $2.10.&quot; If accepted, it earns $2.10 minus Span&#x27;s published fee. If rejected, it earns nothing and its compute is its own loss. Revisions are on the agent.&lt;/p&gt;
      &lt;p&gt;An efficient agent keeps its savings, so agents compete on getting better and cheaper, not on taking more steps or buying placement.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;Span&lt;/div&gt;
      &lt;h3&gt;Earns a published fee, pays for checking and failure&lt;/h3&gt;
      &lt;p&gt;Span&#x27;s take is a stated percentage of finished work, the same for every agent doing that kind of task. Span already pays for the Judge and Verifier; under this design it also eats them on failed attempts.&lt;/p&gt;
      &lt;p&gt;Span makes more by finishing more work that people keep and come back for, never by steering.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;who&quot;&gt;Acceptance&lt;/div&gt;
      &lt;h3&gt;Judge first, person second, silence counts as yes&lt;/h3&gt;
      &lt;p&gt;The Judge gives the first verdict. The person can send work back within a window, say 72 hours. If they say nothing, the work is accepted and earnings release.&lt;/p&gt;
      &lt;p&gt;Every verdict also teaches the taste signal. An agent can contest a send-back once; it goes to a review queue. People who reject almost everything are rate-limited, so nobody gets free work by always saying no.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;h3&gt;How Span ranks agents for a person&lt;/h3&gt;
    &lt;p&gt;A cheap agent that fails half the time costs more than a pricier one that almost always succeeds, because each failure costs a retry, a check and the person&#x27;s time. And the best agent for one person isn&#x27;t the best for another.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;rank for this person = taste fit × acceptance rate (this kind of task) ÷ cost of a finished task &amp;nbsp;·&amp;nbsp; Span&#x27;s fee is never an input&lt;/div&gt;
  &lt;div class=&quot;formula&quot;&gt;cost of a finished task = agent&#x27;s price + (Judge and Verifier cost ÷ acceptance rate)&lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;This replaces the static per-call cost term. Acceptance rate is measured from the same verdicts that release money, so ranking and payout never disagree about whether an agent is good. New agents start with a cautious estimate (the sandbox&#x27;s 0.5 to 0.7 band), get real chances through a working newcomer boost, and earn traffic as their record grows.&lt;/p&gt;

    &lt;h3&gt;One published fee; quality rewarded through ranking&lt;/h3&gt;
    &lt;p&gt;An earlier version of this memo proposed two things I now think are wrong. One was letting Span earn a variable gap between the person&#x27;s price and the agent&#x27;s price. The other was charging agents with better acceptance rates a lower fee (for example 20% below 70% acceptance, 15% from 70% to 90%, 10% above 90%). Both give Span a money reason to prefer some agents over others, which is the sponsored-search problem moved inside Span. The cleaner design is one published fee per kind of task. Quality is rewarded the honest way, by being chosen more often. Today&#x27;s year-one and volume tiers can stay as developer incentives because the ranking can&#x27;t see them.&lt;/p&gt;

    &lt;h3&gt;Two modes, not one&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Fixed price per task&lt;/b&gt; for kinds of task with a checkable result: booking a meeting, filing an expense report, finding every deduction. This is the default wherever the Judge&#x27;s accuracy has been measured.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Metered&lt;/b&gt; (today&#x27;s cost-plus model, with budget caps) for open-ended work like &quot;help me think through my pricing&quot; and for new kinds of task, shown on the receipt as &quot;billed by usage.&quot;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;p&gt;A kind of task moves from metered to fixed price once Span has enough accepted runs to price it with confidence. The metered history is the pricing data.&lt;/p&gt;

    &lt;h3&gt;Sharing the return, later and narrowly&lt;/h3&gt;
    &lt;p&gt;Taking a share of the value created fits only where value is countable: a refund recovered, a charge disputed, a meeting booked. There, the price can be a share of the money recovered with a floor. Everywhere else it invites the same fraud CPA advertising did, so it waits until fixed-price tasks work.&lt;/p&gt;

    &lt;h3&gt;How Span reports revenue&lt;/h3&gt;
    &lt;p&gt;As merchant of record, Span may be able to book the full amount people pay as revenue. That is the inflated kind of number the tweet warns about. Lead with Span&#x27;s net fee and its margin per finished task, with gross shown alongside. &lt;span class=&quot;lbl q&quot;&gt;Open&lt;/span&gt;Confirm the accounting with an accountant before any investor material.&lt;/p&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 6 --&gt;
&lt;section id=&quot;s6&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;6 · Product specification&lt;/div&gt;
    &lt;h2&gt;The pieces, the rules they must keep, and what to measure&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;lbl p&quot;&gt;Proposal&lt;/span&gt; Written for the product integration document. Names are suggestions; the behavior is the point.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;spec&quot;&gt;
    &lt;h4&gt;6.1 New or changed records&lt;/h4&gt;
    &lt;div class=&quot;in&quot;&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Attempt outcome&lt;/b&gt; on each attempt: approve, revision, reject, escalate or failed, plus when it was decided. &lt;i&gt;Built on the branch as migration 986; that number was taken on master on 12 October, so it gets a new one before pushing.&lt;/i&gt;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Earning state&lt;/b&gt; on each developer earning: held, released or voided, plus the reason and when.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Acceptance window&lt;/b&gt; per task: when it opens, when it auto-accepts (default 72 hours), and who decided.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Agent price&lt;/b&gt; per agent and kind of task: committed price, valid from, notice period before a change.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Task quote&lt;/b&gt;: one signed price per task, bound to the task, reusing the wallet quote&#x27;s signing.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Published fee&lt;/b&gt; per kind of task, shown to agents and on receipts.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Dispute&lt;/b&gt;: an agent&#x27;s single contest of a send-back, its review and its result.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Taste signal&lt;/b&gt; that also moves down on a send-back and records the reason, per kind of task. The reasons already exist in &lt;code&gt;core.work_verdicts&lt;/code&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Refund reason&lt;/b&gt; in the credit ledger for refunds after settlement (today only top-up refunds exist).&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;spec&quot;&gt;
    &lt;h4&gt;6.2 Rules the system must always keep&lt;/h4&gt;
    &lt;div class=&quot;in&quot;&gt;
      &lt;ul&gt;
        &lt;li&gt;Ranking never reads a fee, a margin or any money paid to Span. A test fails if it does.&lt;/li&gt;
        &lt;li&gt;No paid placement, sponsored slot or &quot;featured&quot; agent in any list Span shows or uses.&lt;/li&gt;
        &lt;li&gt;Earnings are released only for accepted work; a rejected or failed attempt earns nothing.&lt;/li&gt;
        &lt;li&gt;The first recorded outcome for an attempt is final. A redelivered result can&#x27;t change it.&lt;/li&gt;
        &lt;li&gt;The person never pays for a revision, a retry or a quality check under fixed pricing.&lt;/li&gt;
        &lt;li&gt;Payouts pay only released earnings. The drift check stays.&lt;/li&gt;
        &lt;li&gt;Ranking and payouts read the same verdicts.&lt;/li&gt;
        &lt;li&gt;Taste data belongs to the person. It travels across providers only with their memory and is never sold or used to price against them.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;spec&quot;&gt;
    &lt;h4&gt;6.3 What to measure&lt;/h4&gt;
    &lt;div class=&quot;in&quot;&gt;
      &lt;ul&gt;
        &lt;li&gt;How often the Judge agrees with the person, per kind of task. This decides whether paying on the Judge is fair.&lt;/li&gt;
        &lt;li&gt;Acceptance rate per agent per kind of task, and the top send-back reasons.&lt;/li&gt;
        &lt;li&gt;Cost of a finished task per agent per kind of task.&lt;/li&gt;
        &lt;li&gt;Share of work going to the top agent per kind of task (concentration), and how often newcomers get chosen.&lt;/li&gt;
        &lt;li&gt;Per developer: credited versus would-be-paid under acceptance. The shadow report on the branch does this.&lt;/li&gt;
        &lt;li&gt;Span&#x27;s net fee and margin per finished task; the person&#x27;s spend on failed work (target: zero under fixed pricing).&lt;/li&gt;
        &lt;li&gt;Disputes per agent and send-back rate per person, to catch abuse in both directions.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;spec&quot;&gt;
    &lt;h4&gt;6.4 What people see&lt;/h4&gt;
    &lt;div class=&quot;in&quot;&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;The person:&lt;/b&gt; one price before work, the result, a keep or send-back choice with an optional reason, and a receipt that says &quot;fixed price, delivered&quot; or &quot;billed by usage&quot;, plus &quot;Span paid the vendor, fee included&quot; or &quot;on your account.&quot;&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;The agent&#x27;s developer:&lt;/b&gt; committed prices, held versus released earnings, the published fee, a scorecard with acceptance and send-back reasons, and disputes.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Everyone:&lt;/b&gt; a plain statement that no one can pay for rank, matching the whitepaper&#x27;s promise.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 7 --&gt;
&lt;section id=&quot;s7&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;7 · Margins&lt;/div&gt;
    &lt;h2&gt;Who earns what, today versus paid on acceptance&lt;/h2&gt;
    &lt;p&gt;Move the sliders to see one kind of task under both models. &quot;Today&quot; bills the person for every attempt at the agent&#x27;s per-attempt charge, plus the quality checks, and Span keeps its fee. (Since Span is free and already pays for its own checks, today&#x27;s real bill is a little lower; the comparison shows the paid-agent case.) &quot;Paid on acceptance&quot; bills the person the agent&#x27;s price only if the task is delivered, takes the same published fee from the agent&#x27;s side, and puts the quality checks on Span. The defaults are illustrative, not measured Span data.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;calc&quot;&gt;
    &lt;div class=&quot;inputs&quot;&gt;
      &lt;div class=&quot;presets&quot; role=&quot;group&quot; aria-label=&quot;Example scenarios&quot;&gt;
        &lt;button type=&quot;button&quot; data-p=&quot;strong&quot;&gt;Reliable agent&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-p=&quot;typical&quot;&gt;Typical agent&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-p=&quot;weak&quot;&gt;Unreliable agent&lt;/button&gt;
      &lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;p&quot;&gt;Acceptance rate per attempt &lt;output id=&quot;p-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;p&quot; type=&quot;range&quot; min=&quot;0.2&quot; max=&quot;0.99&quot; step=&quot;0.01&quot; value=&quot;0.75&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;n&quot;&gt;Attempts before giving up &lt;output id=&quot;n-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;n&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;5&quot; step=&quot;1&quot; value=&quot;3&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;c&quot;&gt;Agent&#x27;s own compute per attempt &lt;output id=&quot;c-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;c&quot; type=&quot;range&quot; min=&quot;0.1&quot; max=&quot;5&quot; step=&quot;0.05&quot; value=&quot;1.20&quot;&gt;&lt;div class=&quot;hint&quot;&gt;What the agent spends on models and tools.&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;r&quot;&gt;Today: agent&#x27;s charge per attempt &lt;output id=&quot;r-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;r&quot; type=&quot;range&quot; min=&quot;0.1&quot; max=&quot;6&quot; step=&quot;0.05&quot; value=&quot;1.80&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;b&quot;&gt;New: agent&#x27;s price per finished task &lt;output id=&quot;b-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;b&quot; type=&quot;range&quot; min=&quot;0.1&quot; max=&quot;8&quot; step=&quot;0.05&quot; value=&quot;2.10&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;f&quot;&gt;Span&#x27;s published fee (both models) &lt;output id=&quot;f-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;f&quot; type=&quot;range&quot; min=&quot;0.05&quot; max=&quot;0.3&quot; step=&quot;0.01&quot; value=&quot;0.20&quot;&gt;&lt;/div&gt;
      &lt;div&gt;&lt;label for=&quot;j&quot;&gt;Judge and Verifier cost per attempt &lt;output id=&quot;j-o&quot;&gt;&lt;/output&gt;&lt;/label&gt;&lt;input id=&quot;j&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;0.5&quot; step=&quot;0.01&quot; value=&quot;0.08&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;results&quot;&gt;
      &lt;div class=&quot;tbl&quot;&gt;
        &lt;table aria-live=&quot;polite&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Per task requested&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Today&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Paid on acceptance&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Chance it gets done&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-pd&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-pd2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Expected attempts&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-ea&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-ea2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Person pays&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-u1&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-u2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Person pays per &lt;i&gt;finished&lt;/i&gt; task&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-uf1&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-uf2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Person pays for failed work&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-w1&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-w2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Agent profit after compute&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-a1&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-a2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Span margin&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-s1&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-s2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Span margin, % of what the person pays&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-sp1&quot;&gt;&lt;/td&gt;&lt;td class=&quot;num&quot; id=&quot;o-sp2&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;
      &lt;p class=&quot;verdict&quot; id=&quot;verdict&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;p&gt;Three things the calculator shows, which hold across most settings:&lt;/p&gt;
    &lt;ul&gt;
      &lt;li&gt;&lt;b&gt;Unreliable agents stop being profitable.&lt;/b&gt; At the defaults, today a 40%-acceptance agent earns about $0.47 per task and a 92% one about $0.26, because the weaker agent bills more attempts. Paid on acceptance, the 40% agent loses about $1.03 per task and has to improve or leave. That is the tweet&#x27;s &quot;value destruction,&quot; happening inside Span&#x27;s marketplace instead of to it.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;The person stops paying for failure.&lt;/b&gt; What a finished task costs depends on the price agents set. At the defaults a typical agent&#x27;s finished task costs the person $2.10 instead of about $2.51 today, because failed attempts and checks are off the bill.&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;Span&#x27;s margin per task is often thinner, and depends on finishing.&lt;/b&gt; At the defaults Span keeps about $0.31 per typical task instead of about $0.47, because it now pays for the checks on failed attempts. It keeps its margin by routing to agents that finish, which is the incentive the four rules want. Volume and people coming back must make up the rest; that is a bet, not a calculation.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 8 --&gt;
&lt;section id=&quot;s8&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;8 · How it fits what&#x27;s built&lt;/div&gt;
    &lt;h2&gt;Most of the plumbing exists; what changes is what triggers payment and ranking&lt;/h2&gt;
  &lt;/div&gt;
  &lt;div class=&quot;tbl&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Piece&lt;/th&gt;&lt;th&gt;Today on master&lt;/th&gt;&lt;th&gt;State&lt;/th&gt;&lt;th&gt;Change&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;Neutral ranking&lt;/td&gt;&lt;td&gt;No paid placement; whitepaper promises &quot;no commercial levers.&quot;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill built&quot;&gt;built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Extend to Span&#x27;s own fee and margin; add the test.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Taste learning&lt;/td&gt;&lt;td&gt;Approvals only, 30-day fade, everything &quot;general&quot;, zero weight by default.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill part&quot;&gt;partly built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Learn from send-backs and reasons per kind of task; give it weight; carry it with the person&#x27;s memory.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Newcomer boost&lt;/td&gt;&lt;td&gt;Code exists, no caller.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill none&quot;&gt;switched off&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Reconnect it or replace it; correct the whitepaper either way.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Price in ranking&lt;/td&gt;&lt;td&gt;Static per-call price ÷ budget; zero weight by default.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill part&quot;&gt;partly built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Replace with cost of a finished task.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Estimate&lt;/td&gt;&lt;td&gt;Past costs per agent or type, confidence by sample size.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill built&quot;&gt;built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Keep for metered mode; feed fixed prices.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Up-front quote&lt;/td&gt;&lt;td&gt;Wallet quote is binding, HMAC-signed, a cumulative cap; wallet off, testnet.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill part&quot;&gt;partly built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Reuse the signing for one price per task.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Budget hold&lt;/td&gt;&lt;td&gt;Row-locked reserve, settle, release; &lt;code&gt;BUDGET_EXCEEDED&lt;/code&gt;; off by default.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill built&quot;&gt;built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Reserve the quote; settle on acceptance; release at the retry limit.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Quality verdict&lt;/td&gt;&lt;td&gt;Decided and dropped; person&#x27;s keep or send-back saved per attempt (migration 621).&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill part&quot;&gt;saving on branch&lt;/span&gt;&lt;/td&gt;&lt;td&gt;The branch&#x27;s migration keeps each attempt&#x27;s outcome. Next: trigger release from it plus the person&#x27;s verdict and a window.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Developer earnings&lt;/td&gt;&lt;td&gt;Credited at settlement.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill built&quot;&gt;built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Add held, released and voided.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Payouts&lt;/td&gt;&lt;td&gt;Intent first, idempotent transfer, drift halt; manual trigger; staging moves no real money.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill built&quot;&gt;built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Pay only released earnings; add the scheduler the schedule setting implies.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Fees&lt;/td&gt;&lt;td&gt;10/15/20% tiers; both conditional tiers broken on master.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill part&quot;&gt;fixed on branch&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Publish one fee per kind of task; keep tiers as hidden incentives.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Fee wording&lt;/td&gt;&lt;td&gt;Legal page says Span adds no fee; Brave priced at +50% but unbillable.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill none&quot;&gt;conflict&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Decide the fee, then align the legal page and receipts.&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Agent prices, scorecards, disputes&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;pill none&quot;&gt;not built&lt;/span&gt;&lt;/td&gt;&lt;td&gt;As in section 6.&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- 9 --&gt;
&lt;section id=&quot;s9&quot;&gt;
  &lt;div class=&quot;col&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;9 · The branch, order of work, decisions&lt;/div&gt;
    &lt;h2&gt;Six steps, each useful on its own&lt;/h2&gt;
    &lt;p&gt;&lt;span class=&quot;lbl f&quot;&gt;Fact&lt;/span&gt; Branch &lt;code&gt;feat/paid-on-acceptance&lt;/code&gt; holds three commits, last rebased on master 47f1687d69 on 10 October, not yet pushed.&lt;/p&gt;
